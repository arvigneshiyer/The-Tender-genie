<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tender Genie — Bid Evaluator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --navy:#0B1F3A; --navyMid:#152E55; --blue:#1A5CA8; --blueL:#2574D4;
    --gold:#C49A2D; --goldL:#E8BB4A; --smoke:#F4F5F7; --white:#FFFFFF;
    --text:#1A1F2E; --muted:#5B6478; --border:#D4D8E2; --danger:#C0392B;
    --success:#1A7A4A; --teal:#0E7490; --bg:#EEF1F6;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html{font-size:15px}
  body{font-family:'Georgia','Times New Roman',serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{padding:18px 28px;background:linear-gradient(135deg, var(--navy) 0%, var(--navyMid) 100%);display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold)}
  header h1{font-size:19px;margin:0;font-weight:700;color:var(--white);letter-spacing:.02em}
  header h1 span{color:var(--goldL)}
  header .muted{color:#8FA8C8}
  .layout{display:flex;min-height:calc(100vh - 68px)}
  nav{width:240px;border-right:1px solid var(--border);padding:18px 10px;flex-shrink:0;background:var(--white)}
  nav .step{padding:10px 12px;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  nav .step .num{width:22px;height:22px;border-radius:50%;background:var(--smoke);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:700;color:var(--navyMid)}
  nav .step.active{background:var(--smoke);color:var(--navy);font-weight:700}
  nav .step.active .num{background:var(--blue);color:#fff;border-color:var(--blue)}
  nav .step.done .num{background:var(--success);color:#fff;border-color:var(--success)}
  main{flex:1;padding:28px;max-width:1000px}
  .card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(11,31,58,.06)}
  .card h2{margin:0 0 4px;font-size:16px;color:var(--navy);font-weight:700}
  .card .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .drop{border:2px dashed var(--border);border-radius:6px;padding:28px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--smoke)}
  .drop:hover{border-color:var(--blue);color:var(--blue)}
  input[type=file]{display:none}
  button{background:var(--blue);color:#fff;border:none;padding:10px 18px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:700;font-family:-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.01em}
  button:hover{background:var(--blueL)}
  button.secondary{background:var(--white);border:1px solid var(--border);color:var(--navyMid)}
  button.secondary:hover{background:var(--smoke)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.small{padding:6px 12px;font-size:12px}
  textarea,input[type=text]{width:100%;background:var(--white);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px;font-size:13px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  textarea{min-height:110px;resize:vertical}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:var(--navyMid);color:var(--white);font-weight:700;font-size:11px;letter-spacing:.03em}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .badge.ok{background:rgba(26,122,74,.12);color:var(--success)}
  .badge.warn{background:rgba(196,154,45,.15);color:var(--gold)}
  .badge.err{background:rgba(192,57,43,.12);color:var(--danger)}
  .badge.info{background:rgba(26,92,168,.12);color:var(--blue)}
  .muted{color:var(--muted);font-size:12px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bidder-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .bidder-tabs .tab{padding:6px 12px;border-radius:6px;background:var(--smoke);cursor:pointer;font-size:12.5px;border:1px solid var(--border);font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:var(--navyMid)}
  .bidder-tabs .tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .flag{color:var(--danger);font-weight:700}
  .fileitem{display:flex;justify-content:space-between;align-items:center;background:var(--smoke);padding:8px 12px;border-radius:6px;margin-top:8px;font-size:12.5px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;border:1px solid var(--border)}
  .fileitem .x{color:var(--danger);cursor:pointer;font-weight:700}
  .kv{display:grid;grid-template-columns:160px 1fr;gap:6px 14px;font-size:13px;margin-top:10px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .kv div:nth-child(odd){color:var(--muted)}
  footer.stepnav{display:flex;justify-content:space-between;margin-top:6px}
  .log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);background:var(--smoke);border:1px solid var(--border);border-radius:6px;padding:10px;max-height:160px;overflow:auto;white-space:pre-wrap}
  #boot{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9999;transition:opacity .5s}
  #boot.hide{opacity:0;pointer-events:none}
  .boot-logo{font-size:44px;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .boot-title{color:var(--goldL);font-size:20px;font-weight:700;letter-spacing:.08em;text-align:center;font-family:Georgia,serif}
  .boot-sub{color:#8FA8C8;font-size:12px;letter-spacing:.1em;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .boot-bar{width:200px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
  .boot-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--goldL));border-radius:2px;animation:load 1.4s ease-in-out forwards}
  @keyframes load{from{width:0}to{width:100%}}
</style>
</head>
<body>

<div id="boot">
  <div class="boot-logo">📋</div>
  <div class="boot-title">BID EVALUATOR</div>
  <div class="boot-sub">MULTI-STAGE TENDER EVALUATION · THE TENDER GENIE</div>
  <div class="boot-bar"><div class="boot-fill"></div></div>
</div>

<header>
  <h1>The Tender <span>Genie</span> — Bid Evaluator</h1>
  <div class="row" style="margin:0;gap:12px">
    <button class="secondary small" onclick="chooseLocalFolder()" id="folderBtn">📁 Choose Local Folder</button>
    <div class="muted" id="folderStatus" style="color:#8FA8C8">No local folder selected</div>
    <div class="muted" id="apiStatus" style="color:#8FA8C8">API: /api/ai.js</div>
  </div>
</header>

<div class="layout">
  <nav id="stepNav"></nav>
  <main id="mainArea"></main>
</div>

<script>
window.addEventListener('load', () => {
  setTimeout(() => {
    const b = document.getElementById('boot');
    if (b) { b.classList.add('hide'); setTimeout(() => b.remove(), 600); }
  }, 900);
});
</script>

<script>
/* ============================================================
   STATE
   ============================================================ */
const state = {
  step: 1,
  api: { base: '' /* same-origin /api/ai.js by default */ },
  tender: { nitNo:'', publishDate:'', closeDate:'', openDate:'', emd:'', department:'', extractedText:'' },
  rfpFiles: [],
  etenderFiles: [],
  prebidFiles: [],
  corrigendumFiles: [],
  corrigendumDelta: '',
  eligibility: [], // {id, description, type, threshold, weight}
  bidsPageFiles: [],
  bidders: [], // {id, name, files:[], technicalText:'', financialText:''}
  evaluation: {}, // bidderId -> [{criterionId, score, reasoning, citation, flags}]
  consensus: {}, // bidderId -> {avgScore, variance, needsReview}
  report: { executiveSummary: '', recommendation: '' },
  log: [],
  localDir: null,       // FileSystemDirectoryHandle for the tender root folder
  localDirName: '',
};

const STEPS = [
  'Upload RFP',
  'eTender Details',
  'Pre-Bid Queries',
  'Corrigendum Compare',
  'Eligibility (LLM)',
  'Bids Upload',
  'Evaluate Bids (LLM)',
  'Generate Report',
];

function log(msg){
  state.log.push(`[${new Date().toLocaleTimeString()}] ${msg}`);
  const el = document.getElementById('logBox');
  if(el){ el.textContent = state.log.slice(-40).join('\n'); el.scrollTop = el.scrollHeight; }
}

/* ============================================================
   LOCAL FOLDER STORAGE
   - Uses the File System Access API (Chrome/Edge) to write real
     files into a folder the user picks once, organized as:
       <TenderFolder>/RFP/, /eTender/, /PreBid/, /Corrigendum/,
       /BidsPage/, /Bidders/<name>/Technical|Financial/
   - Falls back to triggering a browser download if the API
     isn't supported (e.g. Firefox, Safari).
   ============================================================ */
const supportsFSAccess = 'showDirectoryPicker' in window;

async function chooseLocalFolder(){
  if(!supportsFSAccess){
    alert('Your browser doesn\'t support folder access (File System Access API). Files will be saved to your Downloads folder instead.');
    state.localDir = 'fallback';
    document.getElementById('folderStatus').textContent = 'Using Downloads (fallback mode)';
    return;
  }
  try{
    const handle = await window.showDirectoryPicker();
    state.localDir = handle;
    state.localDirName = handle.name;
    document.getElementById('folderStatus').textContent = 'Saving to: ' + handle.name;
    log('Local folder selected: ' + handle.name);
  } catch(err){
    log('Folder selection cancelled or failed: ' + err.message);
  }
}

// Get (or create) a nested directory handle from a path array, e.g. ['Bidders','ABC Ltd','Technical']
async function getOrCreateDir(pathParts){
  let dir = state.localDir;
  for(const part of pathParts){
    dir = await dir.getDirectoryHandle(sanitizeName(part), { create: true });
  }
  return dir;
}

function sanitizeName(name){
  return String(name || 'untitled').replace(/[\/\\:*?"<>|]/g, '_').trim().slice(0,80) || 'untitled';
}

// Save a File object into pathParts (array of folder names) under the chosen root.
// If no folder has been chosen yet, prompts the user for one first (first-upload prompt),
// then reuses that same folder for every subsequent file in this session.
async function saveFileLocally(file, pathParts){
  if(!file) return;

  if(!state.localDir){
    if(!supportsFSAccess){
      // No folder API available at all — fall back to downloads immediately, no prompt needed.
      state.localDir = 'fallback';
      document.getElementById('folderStatus') && (document.getElementById('folderStatus').textContent = 'Using Downloads (fallback mode)');
      triggerDownload(file);
      return;
    }
    try{
      const handle = await window.showDirectoryPicker();
      state.localDir = handle;
      state.localDirName = handle.name;
      const statusEl = document.getElementById('folderStatus');
      if(statusEl) statusEl.textContent = 'Saving to: ' + handle.name;
      log('Local folder selected: ' + handle.name);
    } catch(err){
      log('Folder selection cancelled — file not saved locally: ' + file.name);
      return; // user declined the picker; skip saving this file, don't block the rest of the app
    }
  }

  if(state.localDir === 'fallback'){
    triggerDownload(file);
    return;
  }

  try{
    const dir = await getOrCreateDir(pathParts);
    const fileHandle = await dir.getFileHandle(sanitizeName(file.name), { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(file);
    await writable.close();
    log('Saved locally: ' + pathParts.join('/') + '/' + file.name);
  } catch(err){
    log('Local save failed for ' + file.name + ': ' + err.message);
  }
}

function triggerDownload(file){
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  log('Downloaded (fallback): ' + file.name);
}

/* ============================================================
   API CALL — talks to /api/ai.js (your existing key-rotation proxy)
   ============================================================ */
async function callAI(task, messages, opts={}){
  const res = await fetch((state.api.base || '') + '/api/ai.js', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      task, messages,
      temperature: opts.temperature,
      max_tokens: opts.max_tokens,
    }),
  });
  const data = await res.json();
  if(!res.ok || !data.success){
    throw new Error(data.error || 'AI call failed');
  }
  log(`AI(${task}) via ${data.provider}/${data.model} key#${data.key_used}`);
  return data.content;
}

/* ============================================================
   FILE HELPERS — extract text from PDF/image client-side
   ============================================================ */
if (window['pdfjsLib']) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function extractTextFromFile(file){
  if(file.type === 'application/pdf'){
    return extractTextFromPDF(file);
  } else if(file.type.startsWith('image/')){
    return extractTextFromImage(file);
  } else {
    return await file.text().catch(()=> '[Unsupported file type: ' + file.type + ']');
  }
}

async function extractTextFromPDF(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let text = '';
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    text += content.items.map(i=>i.str).join(' ') + '\n\n';
  }
  if(text.trim().length < 20){
    // likely scanned — fall back to OCR on rendered pages
    log('PDF text layer empty — falling back to OCR (may be slow)');
    text = await ocrPDF(pdf);
  }
  return text;
}

async function ocrPDF(pdf){
  let text = '';
  const maxPages = Math.min(pdf.numPages, 8); // cap for demo performance
  for(let p=1; p<=maxPages; p++){
    const page = await pdf.getPage(p);
    const viewport = page.getViewport({scale: 1.5});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    const { data: { text: t } } = await Tesseract.recognize(canvas, 'eng');
    text += t + '\n\n';
  }
  return text;
}

async function extractTextFromImage(file){
  const { data: { text } } = await Tesseract.recognize(file, 'eng');
  return text;
}

/* ============================================================
   RENDER: NAV
   ============================================================ */
function renderNav(){
  const nav = document.getElementById('stepNav');
  nav.innerHTML = STEPS.map((s,i)=>{
    const n = i+1;
    const cls = ['step'];
    if(n === state.step) cls.push('active');
    if(n < state.step) cls.push('done');
    return `<div class="${cls.join(' ')}" onclick="goToStep(${n})">
      <div class="num">${n < state.step ? '✓' : n}</div>
      <div>${s}</div>
    </div>`;
  }).join('');
}

function goToStep(n){
  state.step = n;
  render();
}

/* ============================================================
   RENDER: MAIN — dispatches to stage renderers
   ============================================================ */
function render(){
  renderNav();
  const main = document.getElementById('mainArea');
  const renderers = [
    renderStage1, renderStage2, renderStage3, renderStage4,
    renderStage5, renderStage6, renderStage7, renderStage8,
  ];
  main.innerHTML = renderers[state.step-1]();
  main.insertAdjacentHTML('beforeend', `
    <div class="card">
      <div class="log" id="logBox">${state.log.slice(-40).join('\n')}</div>
    </div>
    <footer class="stepnav">
      <button class="secondary" onclick="goToStep(${Math.max(1,state.step-1)})" ${state.step===1?'disabled':''}>← Back</button>
      <button onclick="goToStep(${Math.min(8,state.step+1)})" ${state.step===8?'disabled':''}>Next →</button>
    </footer>
  `);
}

/* ============================================================
   STAGE 1 — Upload RFP
   ============================================================ */
function renderStage1(){
  return `
  <div class="card">
    <h2>Stage 1 · Upload Tender RFP</h2>
    <div class="sub">Ingest the original tender document (PDF / Word / Image). Parsed client-side — no LLM.</div>
    <div class="drop" onclick="document.getElementById('rfpInput').click()">Click to upload RFP (PDF/Image)</div>
    <input type="file" id="rfpInput" accept=".pdf,image/*" onchange="handleRFPUpload(event)">
    ${state.rfpFiles.map((f,i)=>`
      <div class="fileitem"><span>${f.name}</span><span class="x" onclick="removeRFP(${i})">✕</span></div>
    `).join('')}
    ${state.tender.extractedText ? `
      <div class="sub" style="margin-top:16px">Extracted text preview</div>
      <textarea readonly>${escapeHtml(state.tender.extractedText.slice(0,3000))}</textarea>
      <span class="badge ok">Parsed ${state.tender.extractedText.length.toLocaleString()} chars</span>
    ` : ''}
  </div>`;
}

async function handleRFPUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  state.rfpFiles.push(file);
  render();
  saveFileLocally(file, ['RFP']);
  log('Parsing RFP: ' + file.name);
  try{
    const text = await extractTextFromFile(file);
    state.tender.extractedText = text;
    log('RFP parsed OK');
  } catch(err){ log('RFP parse error: ' + err.message); }
  render();
}
function removeRFP(i){ state.rfpFiles.splice(i,1); render(); }

/* ============================================================
   STAGE 2 — eTender Details
   ============================================================ */
function renderStage2(){
  const t = state.tender;
  return `
  <div class="card">
    <h2>Stage 2 · Upload eTender Details</h2>
    <div class="sub">Screenshot or PDF of the eTender portal listing page. Auto-extracts metadata via OCR + regex.</div>
    <div class="drop" onclick="document.getElementById('etInput').click()">Click to upload eTender screenshot/PDF</div>
    <input type="file" id="etInput" accept=".pdf,image/*" onchange="handleETenderUpload(event)">
    ${state.etenderFiles.map(f=>`<div class="fileitem"><span>${f.name}</span></div>`).join('')}
    <div class="kv">
      <div>Tender ID / NIT No</div><div><input type="text" value="${t.nitNo}" oninput="t2set('nitNo',this.value)"></div>
      <div>Publish Date</div><div><input type="text" value="${t.publishDate}" oninput="t2set('publishDate',this.value)"></div>
      <div>Closing Date</div><div><input type="text" value="${t.closeDate}" oninput="t2set('closeDate',this.value)"></div>
      <div>Opening Date</div><div><input type="text" value="${t.openDate}" oninput="t2set('openDate',this.value)"></div>
      <div>EMD Amount</div><div><input type="text" value="${t.emd}" oninput="t2set('emd',this.value)"></div>
      <div>Department</div><div><input type="text" value="${t.department}" oninput="t2set('department',this.value)"></div>
    </div>
  </div>`;
}
function t2set(k,v){ state.tender[k] = v; }

async function handleETenderUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  state.etenderFiles.push(file);
  render();
  saveFileLocally(file, ['eTender']);
  log('OCR on eTender page: ' + file.name);
  try{
    const text = await extractTextFromFile(file);
    autoFillTenderMeta(text);
    log('eTender metadata extracted');
  } catch(err){ log('eTender parse error: ' + err.message); }
  render();
}

// Basic regex extraction — refine against real portal formats later
function autoFillTenderMeta(text){
  const patterns = {
    nitNo: /(?:NIT\s*No\.?|Tender\s*ID)\s*[:\-]?\s*([A-Za-z0-9\/\-]+)/i,
    publishDate: /Publish(?:ed)?\s*Date\s*[:\-]?\s*([0-9\-\/]{6,12})/i,
    closeDate: /Closing\s*Date\s*[:\-]?\s*([0-9\-\/]{6,12})/i,
    openDate: /Opening\s*Date\s*[:\-]?\s*([0-9\-\/]{6,12})/i,
    emd: /EMD\s*(?:Amount)?\s*[:\-]?\s*(?:Rs\.?|₹)?\s*([0-9,]+)/i,
    department: /Department\s*[:\-]?\s*([A-Za-z0-9 &,.\-]+)/i,
  };
  for(const [k, re] of Object.entries(patterns)){
    const m = text.match(re);
    if(m && !state.tender[k]) state.tender[k] = m[1].trim();
  }
}

/* ============================================================
   STAGE 3 — Pre-Bid Queries & Corrigendum
   ============================================================ */
function renderStage3(){
  return `
  <div class="card">
    <h2>Stage 3 · Upload Pre-Bid Queries & Corrigendum</h2>
    <div class="sub">Query-response document and/or corrigendum PDF issued before submission deadline.</div>
    <div class="drop" onclick="document.getElementById('prebidInput').click()">Click to upload pre-bid query / corrigendum doc</div>
    <input type="file" id="prebidInput" accept=".pdf,image/*" multiple onchange="handlePrebidUpload(event)">
    ${state.prebidFiles.map((f,i)=>`
      <div class="fileitem"><span>${f.name} ${f._text ? `<span class="badge ok" style="margin-left:8px">parsed</span>`:''}</span><span class="x" onclick="removePrebid(${i})">✕</span></div>
    `).join('')}
  </div>`;
}
async function handlePrebidUpload(e){
  for(const file of e.target.files){
    state.prebidFiles.push(file);
    render();
    saveFileLocally(file, ['PreBid']);
    try{ file._text = await extractTextFromFile(file); log('Parsed pre-bid doc: ' + file.name); }
    catch(err){ log('Parse error: ' + err.message); }
  }
  render();
}
function removePrebid(i){ state.prebidFiles.splice(i,1); render(); }

/* ============================================================
   STAGE 4 — Corrigendum vs Original: Delta report
   ============================================================ */
function renderStage4(){
  return `
  <div class="card">
    <h2>Stage 4 · Corrigendum eTender Page — Compare</h2>
    <div class="sub">Diffs corrigendum text against Stage 1 (RFP) and Stage 2 (original dates/EMD). No LLM.</div>
    <div class="drop" onclick="document.getElementById('corrInput').click()">Click to upload corrigendum eTender page</div>
    <input type="file" id="corrInput" accept=".pdf,image/*" onchange="handleCorrigendumUpload(event)">
    ${state.corrigendumFiles.map(f=>`<div class="fileitem"><span>${f.name}</span></div>`).join('')}
    <div class="row">
      <button ${state.corrigendumFiles.length===0?'disabled':''} onclick="runDeltaCompare()">Run Delta Compare</button>
    </div>
    ${state.corrigendumDelta ? `
      <div class="sub" style="margin-top:16px">Delta Report</div>
      <textarea readonly style="min-height:180px">${escapeHtml(state.corrigendumDelta)}</textarea>
    ` : ''}
  </div>`;
}
async function handleCorrigendumUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  state.corrigendumFiles.push(file);
  render();
  saveFileLocally(file, ['Corrigendum']);
  try{ file._text = await extractTextFromFile(file); log('Parsed corrigendum: ' + file.name); }
  catch(err){ log('Parse error: ' + err.message); }
  render();
}

function runDeltaCompare(){
  const corrText = (state.corrigendumFiles[0] && state.corrigendumFiles[0]._text) || '';
  const original = { ...state.tender };
  // Simple heuristic diff: re-run the same regex extraction on corrigendum text
  // and flag anything that differs from Stage 2 values.
  const patterns = {
    closeDate: /Closing\s*Date\s*[:\-]?\s*([0-9\-\/]{6,12})/i,
    openDate: /Opening\s*Date\s*[:\-]?\s*([0-9\-\/]{6,12})/i,
    emd: /EMD\s*(?:Amount)?\s*[:\-]?\s*(?:Rs\.?|₹)?\s*([0-9,]+)/i,
  };
  let deltas = [];
  for(const [k, re] of Object.entries(patterns)){
    const m = corrText.match(re);
    if(m && original[k] && m[1].trim() !== original[k]){
      deltas.push(`${k}: "${original[k]}" → "${m[1].trim()}"`);
    }
  }
  // naive scope-change flag: look for keywords
  if(/scope|BOQ|quantity|specification/i.test(corrText)){
    deltas.push('Possible scope/BOQ/specification change mentioned — review manually.');
  }
  state.corrigendumDelta = deltas.length
    ? deltas.join('\n')
    : 'No date/EMD deltas detected by pattern match. Review corrigendum text manually for clause-level changes.';
  log('Delta compare complete: ' + deltas.length + ' item(s) flagged');
  render();
}

/* ============================================================
   CHUNKING & RELEVANCE RETRIEVAL
   For 100+ page documents, blind truncation ("just send the
   first N characters") silently drops whatever is past that
   point — which for a real tender is often exactly the clause
   a criterion depends on. Instead: split into overlapping
   chunks, score each chunk by keyword overlap against a query,
   and send only the top-scoring chunks to the LLM.
   ============================================================ */
const STOPWORDS = new Set(['the','a','an','and','or','of','to','in','on','for','with','is','are','be','this','that','shall','must','any','as','by','at','from','it','its','will','should','may']);

function chunkText(text, chunkSize=3500, overlap=400){
  const chunks = [];
  if(!text) return chunks;
  let start = 0;
  while(start < text.length){
    const end = Math.min(start + chunkSize, text.length);
    chunks.push(text.slice(start, end));
    if(end >= text.length) break;
    start = end - overlap;
  }
  return chunks;
}

function tokenize(str){
  return (str.toLowerCase().match(/[a-z0-9]+/g) || []).filter(w => w.length > 2 && !STOPWORDS.has(w));
}

function scoreChunk(chunkTokenSet, queryTokens){
  let score = 0;
  for(const t of queryTokens) if(chunkTokenSet.has(t)) score++;
  return score;
}

// Returns the top-K most relevant chunks (joined) from `text` for the given `query` string.
// Always includes the first chunk too (covers intro/definitions sections), deduped.
function getRelevantExcerpt(text, query, {chunkSize=3500, overlap=400, topK=4, maxChars=14000} = {}){
  const chunks = chunkText(text, chunkSize, overlap);
  if(chunks.length === 0) return '';
  if(chunks.length <= topK) return chunks.join('\n\n---\n\n').slice(0, maxChars);

  const queryTokens = tokenize(query);
  const scored = chunks.map((c, i) => ({
    i, text: c,
    score: scoreChunk(new Set(tokenize(c)), queryTokens),
  }));
  scored.sort((a,b) => b.score - a.score);

  const picked = scored.slice(0, topK);
  if(!picked.some(p => p.i === 0)) picked.push(scored.find(s => s.i === 0));
  picked.sort((a,b) => a.i - b.i); // restore document order for readability

  return picked.map(p => p.text).join('\n\n[...]\n\n').slice(0, maxChars);
}

/* ============================================================
   ELIGIBILITY EXTRACTION LOGIC
   ============================================================ */
  const btn = document.getElementById('eligBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Extracting…';
  try{
    const fullText = state.tender.extractedText || '';
    const chunks = chunkText(fullText, 6000, 500);
    log(`RFP split into ${chunks.length} chunk(s) for eligibility scan`);

    // Scan every chunk (eligibility clauses can appear anywhere in a 100+ page RFP),
    // merge results, then dedupe near-identical criteria.
    let merged = [];
    for(let i=0; i<chunks.length; i++){
      const prompt = `Extract all mandatory and qualifying eligibility criteria from this tender text excerpt with thresholds. This is chunk ${i+1} of ${chunks.length} — only extract what's actually present here, don't guess at missing chunks.
Return ONLY valid JSON: an array of objects like
{"description": "...", "type": "mandatory|qualifying", "threshold": "...", "weight": number|null}
If no eligibility criteria appear in this excerpt, return [].

Excerpt:
"""${chunks[i]}"""`;
      try{
        const raw = await callAI('eligibility', [{role:'user', content: prompt}], {temperature:0.1, max_tokens:2000});
        const parsed = safeParseJsonArray(raw);
        merged = merged.concat(parsed);
        log(`Chunk ${i+1}/${chunks.length}: ${parsed.length} criteria found`);
      } catch(err){
        log(`Chunk ${i+1}/${chunks.length} extraction failed: ${err.message}`);
      }
    }

    // Dedupe: drop criteria whose description is near-identical to one already kept
    const deduped = [];
    for(const c of merged){
      const desc = (c.description || '').toLowerCase().trim();
      if(!desc) continue;
      const isDupe = deduped.some(d => {
        const a = new Set(tokenize(desc)), b = new Set(tokenize(d.description || ''));
        const overlap = [...a].filter(t => b.has(t)).length;
        return overlap / Math.max(a.size, b.size, 1) > 0.7;
      });
      if(!isDupe) deduped.push(c);
    }

    state.eligibility = deduped.map((c,i)=>({ id: 'crit_'+(i+1), ...c }));
    log('Extracted ' + state.eligibility.length + ' unique eligibility criteria (from ' + merged.length + ' raw matches)');
  } catch(err){
    log('Eligibility extraction failed: ' + err.message);
    alert('Eligibility extraction failed: ' + err.message);
  }
  render();
}

/* ============================================================
   STAGE 6 — Bids Received & Submissions
   ============================================================ */
function renderStage6(){
  return `
  <div class="card">
    <h2>Stage 6 · Upload Bids-Received Page & Bid Submissions</h2>
    <div class="sub">Extract bidder list, then attach technical/financial bid files per bidder.</div>
    <div class="drop" onclick="document.getElementById('bidsPageInput').click()">Click to upload bids-received page (screenshot/PDF)</div>

    </div>
  </div>
  <div class="card">
    <h2>Bidders</h2>
    ${state.bidders.length === 0 ? `<div class="muted">No bidders yet.</div>` : state.bidders.map((b,bi)=>`

}

async function handleBidsPageUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  state.bidsPageFiles.push(file);
  render();
  saveFileLocally(file, ['BidsPage']);
  log('OCR on bids-received page: ' + file.name);
  try{
    const text = await extractTextFromFile(file);
    // naive bidder-name extraction: lines that look like "1. XYZ Pvt Ltd" or similar
    const names = Array.from(new Set(
      (text.match(/^[ \t]*\d+[\.\)]\s*([A-Za-z][A-Za-z0-9 &.,'\-]{3,60})/gm) || [])
        .map(l => l.replace(/^[ \t]*\d+[\.\)]\s*/, '').trim())
    ));
    names.forEach(n => addBidder(n));
    log('Detected ' + names.length + ' bidder name(s) — verify and edit as needed');
  } catch(err){ log('Bids page parse error: ' + err.message); }
  render();
}

function addBidder(name){
  state.bidders.push({ id: 'bidder_' + (state.bidders.length+1), name: name || ('Bidder ' + (state.bidders.length+1)), technicalText:'', financialText:'' });
}
function addBidderManually(){ addBidder(''); render(); }
function renameBidder(i, name){ state.bidders[i].name = name; }
function removeBidder(i){ state.bidders.splice(i,1); render(); }

async function handleBidFile(e, bidderIdx, field){
  const file = e.target.files[0];
  if(!file) return;
  render();
  const bidder = state.bidders[bidderIdx];
  const subfolder = field === 'technicalText' ? 'Technical' : 'Financial';
  saveFileLocally(file, ['Bidders', bidder.name || ('Bidder ' + (bidderIdx+1)), subfolder]);
  log(`Parsing ${field} for ${bidder.name}: ${file.name}`);
  try{
    const text = await extractTextFromFile(file);
    state.bidders[bidderIdx][field] = text;
    log('Parsed OK');
  } catch(err){ log('Parse error: ' + err.message); }
  render();
}

/* ============================================================
   STAGE 7 — Evaluate Bids (LLM, heavy, per bidder x criterion)
   ============================================================ */
function renderStage7(){
  const ready = state.eligibility.length > 0 && state.bidders.length > 0;
  return `
  <div class="card">
    <h2>Stage 7 · Evaluate Bids <span class="badge info">LLM · Heavy</span></h2>
    <div class="sub">Scores each bidder against every eligibility criterion, with reasoning. (Single-model scoring in this basic build — swap in multi-model consensus later.)</div>
    <div class="row">
      <button ${!ready?'disabled':''} onclick="runEvaluation()" id="evalBtn">Run Evaluation</button>
      ${!ready ? '<span class="muted">Need eligibility criteria (Stage 5) and at least one bidder with bid text (Stage 6)</span>' : ''}
    </div>
  </div>
  ${state.bidders.length ? `
  <div class="card">
    <div class="bidder-tabs">
      ${state.bidders.map((b,i)=>`<div class="tab ${state._evalTab===i?'active':''}" onclick="setEvalTab(${i})">${escapeHtml(b.name)}</div>`).join('')}
    </div>
    ${renderEvalTable(state._evalTab || 0)}
  </div>` : ''}
  `;
}

function setEvalTab(i){ state._evalTab = i; render(); }

function renderEvalTable(idx){
  const b = state.bidders[idx];
  if(!b) return '';
  const rows = state.evaluation[b.id] || [];
  const consensus = state.consensus[b.id];
  return `
    ${consensus ? `
      <div class="kv" style="margin-bottom:10px">
        <div>Average Score</div><div>${consensus.avgScore.toFixed(1)}</div>
        <div>Needs Review</div><div>${consensus.needsReview ? '<span class="flag">YES — low scores / flags present</span>' : 'No'}</div>
      </div>
    ` : ''}
    <table>
      <tr><th>Criterion</th><th>Score</th><th>Reasoning</th><th>Flags</th></tr>
      ${rows.length ? rows.map(r=>`
        <tr>
          <td>${escapeHtml(r.criterionDesc)}</td>
          <td>${r.score}</td>
          <td>${escapeHtml(r.reasoning)}</td>
          <td>${(r.flags||[]).map(f=>`<span class="badge warn">${escapeHtml(f)}</span>`).join(' ') || '—'}</td>
        </tr>
      `).join('') : `<tr><td colspan="4" class="muted">Not evaluated yet.</td></tr>`}
    </table>
  `;
}

async function runEvaluation(){
  const btn = document.getElementById('evalBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Evaluating…';
  try{
    for(const bidder of state.bidders){
      const bidText = (bidder.technicalText || '') + '\n\n' + (bidder.financialText || '');
      log(`${bidder.name}: bid text is ${bidText.length.toLocaleString()} chars — selecting relevant excerpts per criterion`);
      const scores = [];
      for(const crit of state.eligibility){
        // Instead of blindly sending the first N characters (which drops anything
        // past that point on a 100+ page bid), pick the chunks most relevant to
        // this specific criterion's wording.
        const excerpt = getRelevantExcerpt(bidText, crit.description, { topK: 4, maxChars: 14000 });
        const prompt = `Evaluate this bidder's bid against the following criterion. Score 0-100 with reasoning, and note the page/paragraph if identifiable.
Criterion: ${crit.description} (type: ${crit.type}, threshold: ${crit.threshold || 'n/a'})

Note: the bid text below is the most relevant excerpts selected from a longer document, not the full text. [...] marks a gap between excerpts.

Bid excerpts:
"""${excerpt}"""

Return ONLY valid JSON: {"score": number, "reasoning": "...", "citation": "...", "flags": ["..."]}`;
        try{
          const raw = await callAI('evaluate', [{role:'user', content: prompt}], {temperature:0.1, max_tokens:600});
          const parsed = safeParseJsonObject(raw);
          scores.push({
            criterionId: crit.id,
            criterionDesc: crit.description,
            score: Number(parsed.score) || 0,
            reasoning: parsed.reasoning || '',
            citation: parsed.citation || '',
            flags: parsed.flags || [],
          });
        } catch(err){
          scores.push({ criterionId: crit.id, criterionDesc: crit.description, score: 0, reasoning: 'Evaluation error: ' + err.message, flags:['error'] });
        }
      }
      state.evaluation[bidder.id] = scores;
      const avg = scores.reduce((s,r)=>s+r.score,0) / (scores.length || 1);
      const anyFlags = scores.some(r => (r.flags||[]).length);
      state.consensus[bidder.id] = { avgScore: avg, variance: 0, needsReview: anyFlags || avg < 50 };
      log(`Evaluated ${bidder.name}: avg ${avg.toFixed(1)}`);
      render();
    }
  } catch(err){
    log('Evaluation run failed: ' + err.message);
  }
  render();
}

async function runReportGeneration(){

    const summary = await callAI('report', [{role:'user', content: prompt}], {temperature:0.4, max_tokens:1200});

function exportExcel(){
  const wb = XLSX.utils.book_new();

  const summarySheet = XLSX.utils.aoa_to_sheet([
    ['Tender Evaluation Report'],
    ['NIT No', state.tender.nitNo],
    ['Department', state.tender.department],
    ['Closing Date', state.tender.closeDate],

  ]);
  XLSX.utils.book_append_sheet(wb, summarySheet, 'Summary');

  state.bidders.forEach(b=>{
    const rows = state.evaluation[b.id] || [];
    const sheet = XLSX.utils.aoa_to_sheet([
      ['Criterion','Type','Score','Reasoning','Citation','Flags'],
      ...rows.map(r=>{
        const crit = state.eligibility.find(c=>c.id===r.criterionId) || {};
        return [r.criterionDesc, crit.type||'', r.score, r.reasoning, r.citation||'', (r.flags||[]).join('; ')];
      }),
    ]);
    XLSX.utils.book_append_sheet(wb, sheet, (b.name || 'Bidder').slice(0,28));
  });

  const eligSheet = XLSX.utils.aoa_to_sheet([
    ['Description','Type','Threshold','Weight'],
    ...state.eligibility.map(c=>[c.description, c.type, c.threshold||'', c.weight||'']),
  ]);

  XLSX.writeFile(wb, 'Bid_Evaluation_Report.xlsx');
  log('Excel report exported');
}

/* ============================================================
   UTILITIES
   ============================================================ */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function safeParseJsonArray(raw){
  const cleaned = raw.replace(/```json|```/g, '').trim();
  try{
    const parsed = JSON.parse(cleaned);
    return Array.isArray(parsed) ? parsed : (parsed.criteria || parsed.items || []);
  } catch(e){
    // try to find a JSON array substring
    const m = cleaned.match(/\[[\s\S]*\]/);
    if(m){ try{ return JSON.parse(m[0]); } catch(e2){} }
    throw new Error('Could not parse LLM JSON response');
  }
}

function safeParseJsonObject(raw){
  const cleaned = raw.replace(/```json|```/g, '').trim();
  try{ return JSON.parse(cleaned); }
  catch(e){
    const m = cleaned.match(/\{[\s\S]*\}/);
    if(m){ try{ return JSON.parse(m[0]); } catch(e2){} }
    throw new Error('Could not parse LLM JSON response');
  }
}
