<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tender Genie — Bid Evaluator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<style>
  :root{
    --navy:#0B1F3A; --navyMid:#152E55; --blue:#1A5CA8; --blueL:#2574D4;
    --gold:#C49A2D; --goldL:#E8BB4A; --smoke:#F4F5F7; --white:#FFFFFF;
    --text:#1A1F2E; --muted:#5B6478; --border:#D4D8E2; --danger:#C0392B;
    --success:#1A7A4A; --teal:#0E7490; --bg:#EEF1F6;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html{font-size:15px}
  body{font-family:'Georgia','Times New Roman',serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{padding:18px 28px;background:linear-gradient(135deg, var(--navy) 0%, var(--navyMid) 100%);display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold)}
  header h1{font-size:19px;margin:0;font-weight:700;color:var(--white);letter-spacing:.02em}
  header h1 span{color:var(--goldL)}
  header .muted{color:#8FA8C8}
  main{padding:28px;max-width:1100px;margin:0 auto}
  .card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(11,31,58,.06)}
  .card h2{margin:0 0 4px;font-size:16px;color:var(--navy);font-weight:700}

  /* Authority / project banner — appears once RFP is parsed */
  .rfp-banner{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navyMid) 100%);
    color:#fff;padding:14px 28px;display:flex;align-items:center;gap:14px;
    border-bottom:2px solid var(--gold);
  }
  .rfp-banner .rb-icon{font-size:22px}
  .rfp-banner .rb-authority{font-family:Georgia,serif;font-weight:700;font-size:15px}
  .rfp-banner .rb-project{font-size:12.5px;color:#B9C7DC;font-family:-apple-system,Segoe UI,Roboto,sans-serif}

  /* Game-like horizontal stage track, replacing the old sidebar list */
  .stage-track{
    display:flex;gap:12px;padding:20px 24px;overflow-x:auto;
    background:var(--white);border-bottom:1px solid var(--border);
  }
  .stage-card{
    flex:0 0 132px;border-radius:12px;padding:14px 10px 12px;text-align:center;cursor:pointer;
    position:relative;transition:transform .18s ease, box-shadow .18s ease, background .25s ease;
    background:var(--smoke);border:2px solid transparent;font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    user-select:none;
  }
  .stage-card:hover{transform:translateY(-3px)}
  .stage-card .sc-icon{font-size:24px;display:block;margin-bottom:6px;transition:transform .2s}
  .stage-card .sc-num{
    position:absolute;top:8px;left:10px;font-size:10px;font-weight:800;color:var(--muted);
    background:rgba(255,255,255,.6);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;
  }
  .stage-card .sc-label{font-size:11px;font-weight:600;color:var(--navyMid);line-height:1.25}

  /* Pending (default, untouched) */
  .stage-card.pending{background:var(--smoke);color:var(--muted)}

  /* Active / ready for action — solid blue, glowing, slightly scaled up */
  .stage-card.active{
    background:linear-gradient(135deg, var(--blue), var(--blueL));
    border-color:var(--blueL);transform:scale(1.06);
    box-shadow:0 6px 18px rgba(26,92,168,.35);
  }
  .stage-card.active .sc-label{color:#fff}
  .stage-card.active .sc-num{background:rgba(255,255,255,.85);color:var(--navy)}

  /* Processing — greyish-blue, breathing pulse animation */
  .stage-card.processing{
    background:linear-gradient(135deg, #6B7C93, #8695A8);
    border-color:#6B7C93;animation:cardPulse 1.4s ease-in-out infinite;
  }
  .stage-card.processing .sc-label{color:#fff}
  .stage-card.processing .sc-icon{animation:iconSpin 1.2s linear infinite}
  @keyframes cardPulse{0%,100%{box-shadow:0 0 0 0 rgba(107,124,147,.45)}50%{box-shadow:0 0 0 8px rgba(107,124,147,0)}}
  @keyframes iconSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

  /* Done — left accent bar + checkmark badge, independent of active/pending look */
  .stage-card.done{border-left:5px solid var(--success)}
  .stage-card.done .sc-check{
    position:absolute;top:6px;right:8px;width:17px;height:17px;border-radius:50%;
    background:var(--success);color:#fff;font-size:10px;font-weight:900;
    display:flex;align-items:center;justify-content:center;animation:popIn .3s ease;
  }
  .stage-card.done.active{border-left:5px solid var(--goldL)}
  .stage-card.done.active .sc-check{background:var(--goldL);color:var(--navy)}
  .card .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .drop{border:2px dashed var(--border);border-radius:6px;padding:28px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--smoke)}

  /* Upload cards — interactive drag-and-drop tiles */
  .upload-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:4px}
  .upload-card{
    position:relative;border:2px dashed var(--border);border-radius:12px;background:var(--white);
    padding:22px 18px;text-align:center;cursor:pointer;transition:all .2s ease;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;
  }
  .upload-card:hover{border-color:var(--blue);background:var(--smoke);transform:translateY(-2px);box-shadow:0 4px 14px rgba(11,31,58,.08)}
  .upload-card.dragover{border-color:var(--gold);background:rgba(196,154,45,.08);transform:scale(1.02);box-shadow:0 6px 18px rgba(196,154,45,.18)}
  .upload-card.done{border-style:solid;border-color:var(--success);background:rgba(26,122,74,.05)}
  .upload-card .uc-icon{font-size:34px;margin-bottom:10px;display:block;transition:transform .2s}
  .upload-card:hover .uc-icon{transform:scale(1.12) rotate(-3deg)}
  .upload-card.done .uc-icon{transform:none}
  .upload-card .uc-title{font-weight:700;color:var(--navy);font-size:13.5px;margin-bottom:4px}
  .upload-card .uc-sub{color:var(--muted);font-size:11.5px;line-height:1.4}
  .upload-card .uc-status{margin-top:10px;font-size:11px;font-weight:700;letter-spacing:.03em}
  .upload-card .uc-status.pending{color:var(--muted)}
  .upload-card .uc-status.parsing{color:var(--blue)}
  .upload-card .uc-status.done{color:var(--success)}
  .upload-card .uc-status.error{color:var(--danger)}
  .upload-card .uc-check{
    position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:50%;
    background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:900;animation:popIn .3s ease;
  }
  @keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .upload-card .uc-filename{font-size:10.5px;color:var(--muted);margin-top:6px;word-break:break-all;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .upload-card .uc-spinner{display:inline-block;width:12px;height:12px;border:2px solid rgba(26,92,168,.25);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;margin-right:5px;vertical-align:middle}
  .upload-card.small{padding:14px 12px;border-radius:8px}
  .upload-card.small .uc-icon{font-size:22px;margin-bottom:4px}
  .upload-card.small .uc-title{font-size:12px}
  .upload-card.small .uc-sub{font-size:10.5px}
  .upload-card.small .uc-check{width:18px;height:18px;font-size:10px}
  .drop:hover{border-color:var(--blue);color:var(--blue)}
  input[type=file]{display:none}
  button{background:var(--blue);color:#fff;border:none;padding:10px 18px;border-radius:6px;font-size:13px;cursor:pointer;font-weight:700;font-family:-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.01em}
  button:hover{background:var(--blueL)}
  button.secondary{background:var(--white);border:1px solid var(--border);color:var(--navyMid)}
  button.secondary:hover{background:var(--smoke)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.small{padding:6px 12px;font-size:12px}
  textarea,input[type=text]{width:100%;background:var(--white);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:10px;font-size:13px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  textarea{min-height:110px;resize:vertical}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  th,td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:var(--navyMid);color:var(--white);font-weight:700;font-size:11px;letter-spacing:.03em}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .badge.ok{background:rgba(26,122,74,.12);color:var(--success)}
  .badge.warn{background:rgba(196,154,45,.15);color:var(--gold)}
  .badge.err{background:rgba(192,57,43,.12);color:var(--danger)}
  .badge.info{background:rgba(26,92,168,.12);color:var(--blue)}
  .muted{color:var(--muted);font-size:12px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bidder-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .bidder-tabs .tab{padding:6px 12px;border-radius:6px;background:var(--smoke);cursor:pointer;font-size:12.5px;border:1px solid var(--border);font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:var(--navyMid)}
  .bidder-tabs .tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .flag{color:var(--danger);font-weight:700}
  .fileitem{display:flex;justify-content:space-between;align-items:center;background:var(--smoke);padding:8px 12px;border-radius:6px;margin-top:8px;font-size:12.5px;font-family:-apple-system,Segoe UI,Roboto,sans-serif;border:1px solid var(--border)}
  .fileitem .x{color:var(--danger);cursor:pointer;font-weight:700}
  .kv{display:grid;grid-template-columns:160px 1fr;gap:6px 14px;font-size:13px;margin-top:10px;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .kv div:nth-child(odd){color:var(--muted)}
  footer.stepnav{display:flex;justify-content:space-between;margin-top:6px}
  .log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted);background:var(--smoke);border:1px solid var(--border);border-radius:6px;padding:10px;max-height:160px;overflow:auto;white-space:pre-wrap}
  #boot{position:fixed;inset:0;background:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:9999;transition:opacity .5s}
  #boot.hide{opacity:0;pointer-events:none}
  .boot-logo{font-size:44px;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .boot-title{color:var(--goldL);font-size:20px;font-weight:700;letter-spacing:.08em;text-align:center;font-family:Georgia,serif}
  .boot-sub{color:#8FA8C8;font-size:12px;letter-spacing:.1em;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .boot-bar{width:200px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
  .boot-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--goldL));border-radius:2px;animation:load 1.4s ease-in-out forwards}
  @keyframes load{from{width:0}to{width:100%}}
  #previewOverlay{position:fixed;inset:0;z-index:5000}
  .preview-scrim{position:absolute;inset:0;background:rgba(11,31,58,.55)}
  .preview-pane{
    position:absolute;top:0;right:0;bottom:0;width:min(560px,90vw);
    background:var(--white);box-shadow:-8px 0 24px rgba(11,31,58,.25);
    display:flex;flex-direction:column;animation:slideIn .25s ease-out;
  }
  @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
  .preview-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .preview-title{font-size:15px;font-weight:700;color:var(--navy);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .preview-body{flex:1;overflow:auto;padding:18px}
</style>
</head>
<body>

<div id="boot">
  <div class="boot-logo">📋</div>
  <div class="boot-title">BID EVALUATOR</div>
  <div class="boot-sub">MULTI-STAGE TENDER EVALUATION · THE TENDER GENIE</div>
  <div class="boot-bar"><div class="boot-fill"></div></div>
</div>

<header>
  <h1>The Tender <span>Genie</span> — Bid Evaluator</h1>
</header>

<div id="rfpBannerHost"></div>
<div class="stage-track" id="stepNav"></div>
<main id="mainArea"></main>

<script>
window.addEventListener('load', () => {
  setTimeout(() => {
    const b = document.getElementById('boot');
    if (b) { b.classList.add('hide'); setTimeout(() => b.remove(), 600); }
  }, 900);
});
</script>

<script>
/* ============================================================
   STATE
   ============================================================ */
const state = {
  step: 1,
  api: { base: '' /* same-origin /api/ai.js by default */ },
  tender: { nitNo:'', publishDate:'', closeDate:'', openDate:'', emd:'', department:'', extractedText:'', authorityName:'', projectName:'' },
  rfpFiles: [],
  etenderFiles: [],
  corrigendumFiles: [],
  corrigendumDelta: '',
  eligibility: [], // {id, description, type, threshold, weight}
  scoringCriteria: [], // {id, name, maxMarks, tiers, subWeights, requiresLiveAssessment, notes}
  selectionMethod: { method: '', qualifyingThresholdPct: null }, // e.g. L1, 70%
  bidsPageFiles: [],
  bidders: [], // {id, name, files:[], technicalText:'', financialText:''}
  evaluation: {}, // legacy, unused now — kept for compatibility
  eligibilityCompliance: {}, // bidderId -> [{criterionId, description, status, evidence}]
  scoringResults: {}, // bidderId -> [{criterionId, name, maxMarks, marksAwarded, requiresLiveAssessment, justification}]
  consensus: {}, // bidderId -> {allEligibleCompliant, docsAwarded, docsMax, docsPct, liveMax, needsReview}
  report: { executiveSummary: '', recommendation: '' },
  reportOrientation: 'portrait', // 'portrait' | 'landscape' — applies to both Word and Excel exports
  log: [],
  _processingStage: null, // stage number currently running an async task, or null
};

const STEPS = [
  'Upload RFP',
  'eTender Details',
  'Upload Corrigendum',
  'Eligibility',
  'Technical Scoring',
  'Bids Upload',
  'Evaluate Bids',
  'Generate Report',
];

function log(msg){
  state.log.push(`[${new Date().toLocaleTimeString()}] ${msg}`);
  const el = document.getElementById('logBox');
  if(el){ el.textContent = state.log.slice(-40).join('\n'); el.scrollTop = el.scrollHeight; }
}

/* ============================================================
   UPLOAD CARDS — interactive drag-and-drop tiles used across all
   upload stages. Renders the visual card; drag/drop and click both
   feed the SAME hidden <input type=file> that already has its
   onchange handler wired (e.g. handleRFPUpload) — so no parsing
   logic is duplicated, only the presentation layer changes.
   ============================================================ */
function renderUploadCard({ inputId, icon, title, sub, status='pending', statusText='', fileName='', small=false }){
  const statusLabel = {
    pending: statusText || 'Click or drop file',
    parsing: statusText || 'Parsing…',
    done: statusText || 'Parsed',
    error: statusText || 'Error',
  }[status];
  return `
    <div class="upload-card ${status==='done'?'done':''} ${small?'small':''}"
         onclick="document.getElementById('${inputId}').click()"
         ondragover="event.preventDefault(); this.classList.add('dragover')"
         ondragleave="this.classList.remove('dragover')"
         ondrop="handleCardDrop(event, '${inputId}')">
      ${status==='done' ? '<div class="uc-check">✓</div>' : ''}
      <span class="uc-icon">${icon}</span>
      <div class="uc-title">${escapeHtml(title)}</div>
      <div class="uc-sub">${escapeHtml(sub)}</div>
      <div class="uc-status ${status}">${status==='parsing' ? '<span class="uc-spinner"></span>' : ''}${escapeHtml(statusLabel)}</div>
      ${fileName ? `<div class="uc-filename">${escapeHtml(fileName)}</div>` : ''}
    </div>`;
}

// Dropping files onto a card assigns them to the underlying hidden input and
// fires its existing change handler — same code path as clicking + browsing.
function handleCardDrop(e, inputId){
  e.preventDefault();
  e.currentTarget.classList.remove('dragover');
  const input = document.getElementById(inputId);
  const files = e.dataTransfer && e.dataTransfer.files;
  if(!input || !files || !files.length) return;
  try{
    const dt = new DataTransfer();
    for(const f of files) dt.items.add(f);
    input.files = dt.files;
    input.dispatchEvent(new Event('change', { bubbles: true }));
  } catch(err){
    log('Drag-and-drop failed, please use click-to-browse instead: ' + err.message);
  }
}

/* ============================================================
   API CALL — talks to /api/ai.js (your existing key-rotation proxy)
   ============================================================ */
async function callAI(task, messages, opts={}){
  const res = await fetch((state.api.base || '') + '/api/ai.js', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      task, messages,
      temperature: opts.temperature,
      max_tokens: opts.max_tokens,
    }),
  });
  const data = await res.json();
  if(!res.ok || !data.success){
    const detail = data.details ? (' — ' + data.details) : '';
    throw new Error((data.error || 'AI call failed') + detail);
  }
  return data.content;
}

/* ============================================================
   FILE HELPERS — extract text from PDF/image client-side
   ============================================================ */
if (window['pdfjsLib']) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function extractTextFromFile(file){
  if(file.type === 'application/pdf'){
    return extractTextFromPDF(file);
  } else if(file.type.startsWith('image/')){
    return extractTextFromImage(file);
  } else {
    return await file.text().catch(()=> '[Unsupported file type: ' + file.type + ']');
  }
}

async function extractTextFromPDF(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  let text = '';
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    // Tag each page so later stages can cite real page numbers instead of guessing.
    text += `\n[PAGE ${p}]\n` + content.items.map(i=>i.str).join(' ') + '\n\n';
  }
  if(text.trim().length < 20){
    // likely scanned — fall back to OCR on rendered pages
    log('PDF text layer empty — falling back to OCR (may be slow)');
    text = await ocrPDF(pdf);
  }
  return text;
}

async function ocrPDF(pdf){
  let text = '';
  const maxPages = Math.min(pdf.numPages, 8); // cap for demo performance
  for(let p=1; p<=maxPages; p++){
    const page = await pdf.getPage(p);
    const viewport = page.getViewport({scale: 1.5});
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
    const { data: { text: t } } = await Tesseract.recognize(canvas, 'eng');
    text += `\n[PAGE ${p}]\n` + t + '\n\n';
  }
  return text;
}

async function extractTextFromImage(file){
  const { data: { text } } = await Tesseract.recognize(file, 'eng');
  return text;
}

/* ============================================================
   RENDER: NAV
   ============================================================ */
const STAGE_ICONS = ['📄','🖥️','📑','✅','🎯','📋','⚖️','🏆'];

// Determines whether a stage's work is actually done, based on real state —
// not just "have you visited this page" — so the checkmark reflects genuine progress.
function isStageDone(n){
  switch(n){
    case 1: return !!state.tender.extractedText;
    case 2: return !!(state.tender.nitNo || state.tender.closeDate || state.tender.department || state.etenderFiles.length);
    case 3: return !!state.corrigendumDelta;
    case 4: return state.eligibility.length > 0;
    case 5: return state.scoringCriteria.length > 0;
    case 6: return state.bidders.some(b => b.technicalText);
    case 7: return Object.keys(state.consensus).length > 0;
    case 8: return !!state.report.executiveSummary;
    default: return false;
  }
}

function renderNav(){
  const nav = document.getElementById('stepNav');
  nav.innerHTML = STEPS.map((s,i)=>{
    const n = i+1;
    const done = isStageDone(n);
    const processing = state._processingStage === n;
    const active = n === state.step;
    const cls = ['stage-card', processing ? 'processing' : (active ? 'active' : (done ? 'pending' : 'pending'))];
    if(done) cls.push('done');
    return `<div class="${cls.join(' ')}" onclick="goToStep(${n})">
      <div class="sc-num">${n}</div>
      ${done && !processing ? '<div class="sc-check">✓</div>' : ''}
      <span class="sc-icon">${processing ? '⏳' : STAGE_ICONS[i]}</span>
      <div class="sc-label">${s}</div>
    </div>`;
  }).join('');
}

function goToStep(n){
  state.step = n;
  render();
}

function setProcessing(n){ state._processingStage = n; render(); }
function clearProcessing(){ state._processingStage = null; render(); }

/* ============================================================
   RENDER: MAIN — dispatches to stage renderers
   ============================================================ */
function render(){
  renderNav();

const pageImageCache = new Map(); // "filename|page" -> dataURL

function renderPreviewPanel(){
  let panel = document.getElementById('previewOverlay');
  if(!panel){
    panel = document.createElement('div');
    panel.id = 'previewOverlay';
    document.body.appendChild(panel);
  }
  if(!state._previewOpen){
    panel.innerHTML = '';
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="preview-scrim" onclick="closeCriterionPreview()"></div>
    <div class="preview-pane">
      <div class="preview-header">
        <div>
          <div class="preview-title">${escapeHtml(state._previewTitle || 'Source Page')}</div>
          <div class="muted">${escapeHtml(state._previewCriterionText || '')}</div>
        </div>
        <button class="secondary small" onclick="closeCriterionPreview()">✕ Close</button>
      </div>
      <div class="preview-body">
        ${state._previewLoading
          ? `<div class="muted" style="padding:40px;text-align:center"><span class="spinner"></span>Rendering page…</div>`
          : (state._previewImg
              ? `<img src="${state._previewImg}" style="width:100%;border:1px solid var(--border);border-radius:6px" />`
              : `<div class="muted" style="padding:40px;text-align:center">${escapeHtml(state._previewError || 'Could not render this page.')}</div>`)
        }
      </div>
    </div>
  `;
}

async function showCriterionPreview(critIndex){
  const crit = state.eligibility[critIndex];
  if(!crit || !crit.sourcePage) return;
  const isCorr = crit.sourceDoc === 'Corrigendum';
  const file = isCorr ? state.corrigendumFiles[0] : state.rfpFiles[0];
  await openPagePreview(file, crit.sourcePage, `${isCorr ? 'Corrigendum' : 'RFP'} — Page ${crit.sourcePage}`, crit.description);
}

async function showScoringCriterionPreview(critIndex){
  const crit = state.scoringCriteria[critIndex];
  if(!crit || !crit.sourcePage) return;
  const isCorr = crit.sourceDoc === 'Corrigendum';
  const file = isCorr ? state.corrigendumFiles[0] : state.rfpFiles[0];
  await openPagePreview(file, crit.sourcePage, `${isCorr ? 'Corrigendum' : 'RFP'} — Page ${crit.sourcePage}`, crit.description);
}

// For Stage 7: preview the exact page in a BIDDER's technical bid where evidence
// for a compliance check or a scoring award was found — so the user can visually
// confirm the AI read the right section before trusting the result.
async function showBidEvidencePreview(bidderIdx, kind, itemIndex){
  const bidder = state.bidders[bidderIdx];
  if(!bidder || !bidder.technicalFile) { log('Preview unavailable — no technical bid file on record for this bidder'); return; }
  const item = kind === 'compliance'
    ? (state.eligibilityCompliance[bidder.id] || [])[itemIndex]
    : (state.scoringResults[bidder.id] || [])[itemIndex];
  if(!item || !item.evidencePage) { log('Preview unavailable — no page reference for this item'); return; }
  const label = kind === 'compliance' ? item.description : item.name;
  await openPagePreview(bidder.technicalFile, item.evidencePage, `${bidder.name} — Technical Bid, Page ${item.evidencePage}`, label);
}

// Core preview logic shared by all three entry points above.
async function openPagePreview(file, sourcePage, title, contextText){
  if(!file){ log('Preview unavailable — source file not found'); return; }
  const pageNum = parseInt(sourcePage, 10);
  if(!pageNum || pageNum < 1){ log('Preview unavailable — no valid page number'); return; }

  state._previewOpen = true;
  state._previewLoading = true;
  state._previewImg = null;
  state._previewError = null;
  state._previewTitle = title;
  state._previewCriterionText = contextText || '';
  render();

  const cacheKey = file.name + '|' + pageNum;
  try{
    let dataUrl = pageImageCache.get(cacheKey);
    if(!dataUrl){
      dataUrl = await renderPdfPageToImage(file, pageNum);
      pageImageCache.set(cacheKey, dataUrl);
    }
    state._previewImg = dataUrl;
  } catch(err){
    state._previewError = 'Could not render page: ' + err.message;
    log('Page preview render failed: ' + err.message);
  }
  state._previewLoading = false;
  render();
}

function closeCriterionPreview(){
  state._previewOpen = false;
  render();
}

async function renderPdfPageToImage(file, pageNum){
  if(!file.type || file.type !== 'application/pdf'){
    // Image file (e.g. scanned corrigendum page uploaded as a single image) — just show it directly.
    return await fileToDataUrl(file);
  }
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  if(pageNum > pdf.numPages) throw new Error(`Page ${pageNum} exceeds document length (${pdf.numPages} pages)`);
  const page = await pdf.getPage(pageNum);
  const viewport = page.getViewport({scale: 1.6});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
  return canvas.toDataURL('image/png');
}

function fileToDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Reads the RFP's opening pages to identify the issuing Authority/Client and
// the project/assignment name, so it can be shown as a banner across every stage.
async function detectAuthorityAndProject(fullText){
  const excerpt = fullText.slice(0, 6000); // wider window — title pages often have sparse text density
  const prompt = `This is the opening excerpt of a government tender/RFP document. Identify:
1. authorityName — the Authority/Client organization that issued this tender (not a consultant or bidder)
2. projectName — the short name/title of the project or assignment being tendered

Excerpt:
"""${excerpt}"""

Return ONLY valid JSON: {"authorityName": "..." or null, "projectName": "..." or null}`;
  try{
    const raw = await callAI('extract', [{role:'user', content: prompt}], {temperature:0.1, max_tokens:150});
    const parsed = safeParseJsonObject(raw);
    if(parsed.authorityName) state.tender.authorityName = String(parsed.authorityName).trim().slice(0,150);
    if(parsed.projectName) state.tender.projectName = String(parsed.projectName).trim().slice(0,200);
    if(parsed.authorityName || parsed.projectName){
      log(`Identified: ${parsed.authorityName || '(authority not found)'} — ${parsed.projectName || '(project not found)'}`);
    } else {
      log('Authority/project detection returned no values — raw response: ' + raw.slice(0,200));
    }
    render();
  } catch(err){
    log('Authority/project detection failed (non-fatal): ' + err.message);
  }
}

// Basic regex extraction — refine against real portal formats later
function autoFillTenderMeta(text){
  const patterns = {
    nitNo: /(?:NIT\s*No\.?|Tender\s*ID)\s*[:\-]?\s*([A-Za-z0-9\/\-]+)/i,
    publishDate: /Publish(?:ed)?\s*Date\s*[:\-]?\s*([0-9\-\/]{6,12})/i,
    closeDate: /Closing\s*Date\s*[:\-]?\s*([0-9\-\/]{6,12})/i,
    openDate: /Opening\s*Date\s*[:\-]?\s*([0-9\-\/]{6,12})/i,
    emd: /EMD\s*(?:Amount)?\s*[:\-]?\s*(?:Rs\.?|₹)?\s*([0-9,]+)/i,
    department: /Department\s*[:\-]?\s*([A-Za-z0-9 &,.\-]+)/i,
  };
  for(const [k, re] of Object.entries(patterns)){
    const m = text.match(re);
    if(m && !state.tender[k]) state.tender[k] = m[1].trim();
  }
}

async function handleCorrigendumUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  state.corrigendumFiles.push(file);
  setProcessing(3);
  try{
    const raw = await extractTextFromFile(file);
    // Distinguish corrigendum pages from RFP pages so eligibility extraction
    // can tell which document a criterion (or amendment to one) came from.
    file._text = raw.replace(/\[PAGE (\d+)\]/g, '[CORR PAGE $1]');
    log('Parsed corrigendum: ' + file.name);
    maybeAutoRunEligibility();
  }
  catch(err){ log('Parse error: ' + err.message); }
  clearProcessing();
}

function runDeltaCompare(){
  const corrText = (state.corrigendumFiles[0] && state.corrigendumFiles[0]._text) || '';
  const original = { ...state.tender };
  // Simple heuristic diff: re-run the same regex extraction on corrigendum text
  // and flag anything that differs from Stage 2 values.
  const patterns = {
    closeDate: /Closing\s*Date\s*[:\-]?\s*([0-9\-\/]{6,12})/i,
    openDate: /Opening\s*Date\s*[:\-]?\s*([0-9\-\/]{6,12})/i,
    emd: /EMD\s*(?:Amount)?\s*[:\-]?\s*(?:Rs\.?|₹)?\s*([0-9,]+)/i,
  };
  let deltas = [];
  for(const [k, re] of Object.entries(patterns)){
    const m = corrText.match(re);
    if(m && original[k] && m[1].trim() !== original[k]){
      deltas.push(`${k}: "${original[k]}" → "${m[1].trim()}"`);
    }
  }
  // naive scope-change flag: look for keywords
  if(/scope|BOQ|quantity|specification/i.test(corrText)){
    deltas.push('Possible scope/BOQ/specification change mentioned — review manually.');
  }
  state.corrigendumDelta = deltas.length
    ? deltas.join('\n')
    : 'No date/EMD deltas detected by pattern match. Review corrigendum text manually for clause-level changes.';
  log('Delta compare complete: ' + deltas.length + ' item(s) flagged');
  render();
}

/* ============================================================
   CHUNKING & RELEVANCE RETRIEVAL
   For 100+ page documents, blind truncation ("just send the
   first N characters") silently drops whatever is past that
   point — which for a real tender is often exactly the clause
   a criterion depends on. Instead: split into overlapping
   chunks, score each chunk by keyword overlap against a query,
   and send only the top-scoring chunks to the LLM.
   ============================================================ */
const STOPWORDS = new Set(['the','a','an','and','or','of','to','in','on','for','with','is','are','be','this','that','shall','must','any','as','by','at','from','it','its','will','should','may']);

function chunkText(text, chunkSize=3500, overlap=400){
  const chunks = [];
  if(!text) return chunks;
  let start = 0;
  while(start < text.length){
    const end = Math.min(start + chunkSize, text.length);
    chunks.push(text.slice(start, end));
    if(end >= text.length) break;
    start = end - overlap;
  }
  return chunks;
}

function tokenize(str){
  return (str.toLowerCase().match(/[a-z0-9]+/g) || []).filter(w => w.length > 2 && !STOPWORDS.has(w));
}

function scoreChunk(chunkTokenSet, queryTokens){
  let score = 0;
  for(const t of queryTokens) if(chunkTokenSet.has(t)) score++;
  return score;
}

// Returns the top-K most relevant chunks (joined) from `text` for the given `query` string.
// Always includes the first chunk too (covers intro/definitions sections), deduped.
function getRelevantExcerpt(text, query, {chunkSize=3500, overlap=400, topK=4, maxChars=14000} = {}){
  const chunks = chunkText(text, chunkSize, overlap);
  if(chunks.length === 0) return '';
  if(chunks.length <= topK) return chunks.join('\n\n---\n\n').slice(0, maxChars);

  const queryTokens = tokenize(query);
  const scored = chunks.map((c, i) => ({
    i, text: c,
    score: scoreChunk(new Set(tokenize(c)), queryTokens),
  }));
  scored.sort((a,b) => b.score - a.score);

  const picked = scored.slice(0, topK);
  if(!picked.some(p => p.i === 0)) picked.push(scored.find(s => s.i === 0));
  picked.sort((a,b) => a.i - b.i); // restore document order for readability

  return picked.map(p => p.text).join('\n\n[...]\n\n').slice(0, maxChars);
}

// Called after RFP or Corrigendum finishes parsing. Auto-runs (or re-runs)
// eligibility extraction once the RFP is available, folding in the
// corrigendum too if it's been uploaded by then.
let _eligAutoRunToken = 0;
async function maybeAutoRunEligibility(){
  if(!state.tender.extractedText) return; // need at least the RFP
  const myToken = ++_eligAutoRunToken;
  // Small debounce so near-simultaneous RFP+corrigendum uploads don't trigger two runs
  await new Promise(r => setTimeout(r, 400));
  if(myToken !== _eligAutoRunToken) return; // a newer upload superseded this one
  log('Auto-running eligibility extraction (RFP' + (state.corrigendumFiles[0]?._text ? ' + corrigendum' : '') + ')');
  await runEligibilityExtraction();
  await runScoringCriteriaExtraction();
}

function combinedEligibilitySourceText(){
  const rfp = state.tender.extractedText || '';
  const corr = (state.corrigendumFiles[0] && state.corrigendumFiles[0]._text) || '';
  return corr ? (rfp + '\n\n=== CORRIGENDUM (may amend the RFP above) ===\n\n' + corr) : rfp;
}

// Finds the nearest preceding [PAGE N] or [CORR PAGE N] marker before a given
// character index in the combined source text — used to attach a real source
// page to values pulled by regex rather than by the LLM (e.g. Data Sheet amounts).
function findNearestPageMarker(text, matchIndex){
  const before = text.slice(0, matchIndex);
  const markers = [...before.matchAll(/\[(CORR )?PAGE (\d+)\]/g)];
  if(!markers.length) return { page: null, doc: 'RFP' };
  const last = markers[markers.length-1];
  return { page: last[2], doc: last[1] ? 'Corrigendum' : 'RFP' };
}

// The Bid Processing/Tender Fee and EMD amounts are almost always stated in the
// RFP's Data Sheet (Clause 1), not inside the eligibility table itself (which
// typically just references "Form 6" as proof). Pull the real amounts directly
// via regex so the eligibility rows show actual numbers instead of a vague
// "Form 6" reference.
function extractFeeAndEmdFromDataSheet(fullText){
  // PDF text extraction sometimes inserts stray whitespace inside a number when
  // it crosses a table-cell boundary (e.g. "1,00,000" comes out as "1,0 0,000").
  // Allow optional whitespace between digit groups, then strip it from the result.
  const NUM = '([\\d](?:[\\d,]|\\s(?=[\\d,]))*\\d)';
  const feePatterns = [
    new RegExp(`(?:Tender|Bid)\\s*Processing\\s*Fee\\s*[:\\-]?\\s*(?:Rs\\.?|INR|₹)\\s*${NUM}`, 'i'),
    new RegExp(`Processing\\s*Fee\\s*[:\\-]?\\s*(?:Rs\\.?|INR|₹)\\s*${NUM}`, 'i'),
  ];
  const emdPatterns = [
    new RegExp(`Earnest\\s*Money\\s*Deposit\\s*[:\\-]?\\s*(?:Rs\\.?|INR|₹)\\s*${NUM}`, 'i'),
    new RegExp(`\\bEMD\\b\\s*[:\\-]?\\s*(?:Rs\\.?|INR|₹)\\s*${NUM}`, 'i'),
  ];
  let fee = null, feeIdx = -1, emd = null, emdIdx = -1;
  for(const re of feePatterns){ const m = fullText.match(re); if(m){ fee = m[1].replace(/\s+/g,''); feeIdx = m.index; break; } }
  for(const re of emdPatterns){ const m = fullText.match(re); if(m){ emd = m[1].replace(/\s+/g,''); emdIdx = m.index; break; } }
  return {
    fee, feeSource: feeIdx >= 0 ? findNearestPageMarker(fullText, feeIdx) : null,
    emd, emdSource: emdIdx >= 0 ? findNearestPageMarker(fullText, emdIdx) : null,
  };
}

// The selection method (L1, QCBS 70:30, QCBS 80:20, Empanelment, etc.) and the
// qualifying technical threshold are almost always stated plainly in the RFP's
// Data Sheet (e.g. "Method of selection: L1") — pull them directly via regex
// rather than relying solely on the LLM noticing it buried in a long document.
function extractSelectionMethodFromDataSheet(fullText){
  const methodPatterns = [
    /Method\s*of\s*[Ss]election\s*[:\-]?\s*(QCBS\s*\(?\s*\d{1,3}\s*[:\-]\s*\d{1,3}\s*\)?|L\s*1|QCBS|Empanelment|Least\s*Cost)/i,
    /\b(QCBS\s*\(?\s*\d{1,3}\s*[:\-]\s*\d{1,3}\s*\)?)\b/i,
  ];
  const thresholdPatterns = [
    /minimum\s*(?:technical\s*)?score\s*of\s*(\d{1,3})\s*%/i,
    /qualifying\s*technical\s*score\s*(?:is|of)?\s*(\d{1,3})\s*%/i,
    /technical\s*score\s*of\s*(\d{1,3})\s*%\s*is\s*fixed/i,
  ];
  let method = null;
  for(const re of methodPatterns){ const m = fullText.match(re); if(m){ method = m[1].replace(/\s+/g,' ').trim(); break; } }
  let pct = null;
  for(const re of thresholdPatterns){ const m = fullText.match(re); if(m){ pct = parseFloat(m[1]); break; } }
  return { method, qualifyingThresholdPct: pct };
}

// Generic section-anchoring: given a full document and a set of heading /
// end-boundary / signal-term patterns, locates a named section and slices
// it out — so callers can send ONE small slice to the AI instead of
// chunking and scanning the entire 100+ page document. Returns null if no
// confident anchor is found, so the caller can fall back to a full scan.
// `label` is just for log messages (e.g. "Eligibility section", "Scoring
// criteria section").
function findNamedSection(fullText, { label, headingPatterns, endPatterns, signalTerms, maxLen = 8000, minLen = 200 }){
  const { stripped, map } = stripPageMarkersWithMap(fullText);
  const toOriginal = (strippedIdx) => {
    if(strippedIdx <= 0) return 0;
    if(strippedIdx >= map.length) return fullText.length;
    return map[strippedIdx];
  };

  let startIdxStripped = -1;
  for(const re of headingPatterns){
    const m = stripped.match(re);
    if(m){ startIdxStripped = m.index; break; }
  }
  if(startIdxStripped === -1){
    log(`${label} anchor: no heading pattern matched — falling back to full scan`);
    return null;
  }
  const startIdx = toOriginal(startIdxStripped);

  const afterStripped = stripped.slice(startIdxStripped + 50); // skip past the heading itself
  let endIdxStripped = stripped.length;
  for(const re of endPatterns){
    const m = afterStripped.match(re);
    if(m){
      const candidate = startIdxStripped + 50 + m.index;
      if(candidate < endIdxStripped) endIdxStripped = candidate;
    }
  }
  let endIdx = toOriginal(endIdxStripped);
  // Cap section length generously; if no end heading matched at all, don't
  // send the whole rest of the document.
  if(endIdx - startIdx > maxLen) endIdx = startIdx + maxLen;

  const slice = fullText.slice(startIdx, endIdx).trim();
  // Sanity check: a real section should contain at least ONE recognizable
  // term; if not, this was probably a false-positive heading match (e.g. a
  // table of contents entry, not the actual section).
  if(!signalTerms.test(slice)){
    log(`${label} anchor: matched a heading but slice (${slice.length} chars) had no recognizable terms — likely a false positive (e.g. table of contents), falling back to full scan`);
    return null;
  }
  // Guard against having anchored to a table-of-contents listing rather than
  // the real section — TOC entries are short (just the heading + page number).
  if(slice.length < minLen){
    log(`${label} anchor: matched slice too short (${slice.length} chars) — likely a table-of-contents entry, falling back to full scan`);
    return null;
  }

  return slice;
}

// PDF extraction inserts [PAGE N] / [CORR PAGE N] markers between text spans.
// If a page break happens to fall mid-heading (e.g. between "4.1" and
// "Eligibility Criteria"), a plain regex match on the raw text fails even
// though the heading is clearly there. This builds a version of the text with
// those markers stripped out, plus a position map back to the original
// indices, so regex matching is robust to markers landing anywhere — while
// slicing still happens on the ORIGINAL text (so downstream sourcePage
// detection, which needs the markers, keeps working).
function stripPageMarkersWithMap(text){
  const re = /\[(?:CORR )?PAGE \d+\]/g;
  let stripped = '';
  const map = []; // map[strippedIndex] = originalIndex
  let lastIndex = 0;
  let m;
  while((m = re.exec(text))){
    for(let i=lastIndex; i<m.index; i++){ stripped += text[i]; map.push(i); }
    lastIndex = m.index + m[0].length;
  }
  for(let i=lastIndex; i<text.length; i++){ stripped += text[i]; map.push(i); }
  return { stripped, map };
}

function findEligibilitySection(fullText){
  return findNamedSection(fullText, {
    label: 'Eligibility section',
    headingPatterns: [
      /\b\d{1,2}\.\d{1,2}\s*\.?\s*Eligibility\s*Criteria\b/i,
      /\bEligibility\s+Conditions\b/i,
      /\bEligibility\s+and\s+Evaluation\s+criteria\b/i,
      /\bClause\s*\d{1,2}\.\d{1,2}\s*[:\-]?\s*Eligibility\b/i,
      /\bELIGIBILITY\s*CRITERIA\b/,                    // all-caps heading, no numbering
      /\bEligibility\s+Criteria\s+for\s+Bidders?\b/i,
      /\bMinimum\s+Eligibility\s+Criteria\b/i,
      /\bQualification\s+Criteria\b/i,
      /\bPre[\s-]?Qualification\s+Criteria\b/i,
      /\bBidder\s+Eligibility\b/i,
    ],
    endPatterns: [
      /\b\d{1,2}\.\d{1,2}\.\d{1,2}\s+[A-Z]/,     // e.g. "4.1.1 Conditions"
      /\b\d{1,2}\.\d{1,2}\s+Evaluation\b/i,       // e.g. "4.2 Evaluation..."
      /\b\d{1,2}\.\d{1,2}\s+[A-Z][a-z]+\s+[A-Z]/, // generic next numbered heading
    ],
    signalTerms: /turnover|EMD|earnest\s*money|GST|blacklist|debarr|ITR|net\s*worth|similar\s*project|documentary\s*proof|registration|incorporat|experience|financial\s*capacity|technical\s*capacity/i,
    maxLen: 8000,
    minLen: 200,
  });
}

// Locates the marks-based "Technical Evaluation Criteria" table (as distinct
// from the pass/fail Eligibility Criteria table above) — e.g. "4.1.2
// Evaluation criteria of e-bids", "Technical Evaluation Criteria", "Marking
// Scheme". Mirrors findEligibilitySection exactly, just with different
// heading/end/signal patterns tuned for the marks-table's own vocabulary
// (Maximum Marks, sub-weightages, presentation, etc.) instead of eligibility's
// (turnover, EMD, GST, etc.).
function findScoringCriteriaSection(fullText){
  return findNamedSection(fullText, {
    label: 'Scoring criteria section',
    headingPatterns: [
      /\b\d{1,2}\.\d{1,2}\.\d{1,2}\s*Evaluation\s*criteria\s*of\s*e-?bids\b/i,
      /\bTechnical\s+Evaluation\s+Criteria\b/i,
      /\bEvaluation\s*[-–—]\s*Method\s*of\s*selection\b/i,
      /\bMarking\s+Scheme\b/i,
      /\bTechnical\s+Scoring\s+(?:Criteria|Rubric)\b/i,
      /\bMarks?[\s-]?based\s+Evaluation\b/i,
      /\b\d{1,2}\.\d{1,2}\s*Evaluation\s*Criteria\b/i,
      /\bCriteria\s+for\s+Technical\s+Evaluation\b/i,
    ],
    endPatterns: [
      /\b\d{1,2}\.\d{1,2}\s+Evaluation\s*[-–—]\s*Method\b/i, // e.g. "4.2 Evaluation - Method..."
      /\b\d{1,2}\s+Instructions\s+to\s+Bidders\b/i,
      /\bAnnexure\s+[A-Z]\b/i,
      /\b\d{1,2}\.\d{1,2}\.\d{1,2}\s+[A-Z]/,     // next numbered sub-heading
      /\b\d{1,2}\.\d{1,2}\s+[A-Z][a-z]+\s+[A-Z]/, // generic next numbered heading
    ],
    signalTerms: /maximum\s*marks|max\s*marks|marks|weightage|sub-?criteria|technical\s*presentation|documents?\s*to\s*be\s*submitted|CV\s*format|grand\s*total/i,
    maxLen: 8000,
    minLen: 200,
  });
}

async function runEligibilityExtraction(){
  const btn = document.getElementById('eligBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Extracting…'; }
  setProcessing(4);
  try{
    const fullText = combinedEligibilitySourceText();
    const hasCorr = !!(state.corrigendumFiles[0] && state.corrigendumFiles[0]._text);

    // Try to anchor directly to the Eligibility Criteria section first — this
    // needs just ONE AI call instead of one per chunk of the whole document.
    const anchoredSection = findEligibilitySection(fullText);
    let chunks;
    if(anchoredSection){
      chunks = [anchoredSection];
      log(`Found "Eligibility Criteria" section directly (${anchoredSection.length} chars) — using 1 AI call instead of scanning the full document`);
    } else {
      chunks = chunkText(fullText, 6000, 500);

    }

    // Scan chunk(s) (usually just the one anchored section; falls back to
    // scanning every chunk of the full document if anchoring failed), merge
    // results, then dedupe near-identical criteria.
    let merged = [];
    for(let i=0; i<chunks.length; i++){
      const prompt = `You are extracting BIDDER ELIGIBILITY / QUALIFICATION criteria from a tender document — the specific pass/fail conditions a bidder's firm must meet to be considered eligible to bid. This is chunk ${i+1} of ${chunks.length} of a tender document (which may include both the original RFP and a later corrigendum that can amend/override RFP clauses). Only extract what's actually present here, don't guess at missing chunks.

STRICT SCOPE — only include criteria that determine whether a BIDDER (the firm/entity) qualifies: minimum annual turnover, years of experience, similar past project count/value, minimum net worth, registration/certification requirements (e.g. GST, PAN, incorporation), litigation/blacklisting/debarment declarations, non-performance declarations, ITR/tax filings, ESI/EPF compliance, bid processing fee and EMD submission. These commonly appear as a numbered table or list, often (but not always) under a heading containing "Eligibility" — but also extract them if they appear as a continuation of such a list without a repeated heading in this particular excerpt, as long as the content itself is clearly a bidder-firm qualification condition.

HARD EXCLUSION — DO NOT extract from a "Team", "Key Personnel", "Key Professionals", "Staffing", or similar section, even though it lists things like "minimum 10 years experience" or "Bachelor's Degree in Civil Engineering." That section describes the REQUIRED PROJECT TEAM/PERSONNEL the winning bidder must deploy for the assignment — it is part of the Terms of Reference / Scope of Work, not bidder eligibility. A row like "Team Leader — minimum 10 years, Bachelor's + Master's degree" is about a PERSON'S qualifications for a job role, not the BIDDER FIRM's eligibility to bid — always exclude it. Eligibility criteria describe the FIRM's turnover, registration, past projects, legal standing, tax compliance — not a named role's individual CV requirements.

Do NOT include: general scope-of-work descriptions, technical specifications of the deliverable itself, submission format/procedure instructions, definitions, payment terms, or timeline/schedule details. If a sentence describes what the WORK involves rather than what the BIDDER must have/prove, exclude it.

For each criterion found, capture:
- description: the condition text as printed (may reference a documentary proof column too — include that briefly if present)
- type: "mandatory" or "qualifying" — use "mandatory" unless the source itself distinguishes tiers/scoring
- threshold: any numeric threshold stated (amount, years, count), or null
- weight: a numeric weight only if stated, else null
- originalNo: the source's own printed serial number for this row, as a string, exactly as shown, if present (e.g. "1", "6", "10") — this may repeat or skip across rows, that's expected and correct; use null if the source has no numbering
- sourcePage: the number from the nearest [PAGE N] or [CORR PAGE N] marker in the excerpt this row came from, if present (just the number)
- sourceDoc: "Corrigendum" if it came from a [CORR PAGE N] marker, otherwise "RFP"

Return ONLY valid JSON: an array of objects as described. If no genuine bidder-eligibility criteria appear in this excerpt, return [].

Excerpt:
"""${chunks[i]}"""`;
      try{
        const raw = await callAI('eligibility', [{role:'user', content: prompt}], {temperature:0.1, max_tokens:4000});
        const parsed = safeParseJsonArray(raw);
        merged = merged.concat(parsed);
        log(`Chunk ${i+1}/${chunks.length}: ${parsed.length} criteria found`);
      } catch(err){
        log(`Chunk ${i+1}/${chunks.length} extraction failed: ${err.message}`);
      }
    }

    // If the anchored single-chunk attempt came back completely empty (e.g. the
    // section text didn't parse as expected), fall back once to the full-document
    // chunk scan rather than silently returning zero criteria.
    if(anchoredSection && merged.length === 0){
      log('Anchored section returned 0 criteria — falling back to full-document scan');
      const fallbackChunks = chunkText(fullText, 6000, 500);
      for(let i=0; i<fallbackChunks.length; i++){
        const prompt = `You are extracting BIDDER ELIGIBILITY / QUALIFICATION criteria from a tender document — the specific pass/fail conditions a bidder's firm must meet to be considered eligible to bid. This is chunk ${i+1} of ${fallbackChunks.length} of a tender document (which may include both the original RFP and a later corrigendum that can amend/override RFP clauses). Only extract what's actually present here, don't guess at missing chunks.

- description: the condition text as printed (may reference a documentary proof column too — include that briefly if present)

- sourcePage: the number from the nearest [PAGE N] or [CORR PAGE N] marker in the excerpt this row came from, if present (just the number)

"""${fallbackChunks[i]}"""`;
        try{
          const raw = await callAI('eligibility', [{role:'user', content: prompt}], {temperature:0.1, max_tokens:4000});
          const parsed = safeParseJsonArray(raw);
          merged = merged.concat(parsed);
          log(`Fallback chunk ${i+1}/${fallbackChunks.length}: ${parsed.length} criteria found`);
        } catch(err){
          log(`Fallback chunk ${i+1}/${fallbackChunks.length} extraction failed: ${err.message}`);
        }
      }
    }

    // Dedupe: drop criteria whose description is near-identical to one already kept.
    // If a corrigendum version and an RFP version of the same criterion both appear,
    // prefer the corrigendum one (it's the amendment / latest word).
    const deduped = [];
    for(const c of merged){
      const desc = (c.description || '').toLowerCase().trim();
      if(!desc) continue;
      const dupeIdx = deduped.findIndex(d => {
        const a = new Set(tokenize(desc)), b = new Set(tokenize(d.description || ''));
        const overlap = [...a].filter(t => b.has(t)).length;
        return overlap / Math.max(a.size, b.size, 1) > 0.7;
      });
      if(dupeIdx === -1){
        deduped.push(c);
      } else if(c.sourceDoc === 'Corrigendum' && deduped[dupeIdx].sourceDoc !== 'Corrigendum'){
        deduped[dupeIdx] = c; // corrigendum supersedes the RFP version
      }
    }

    // Deterministic safety net: prompt instructions alone don't reliably keep the
    // model out of the Team/Key Personnel section (it still leaks through sometimes
    // despite explicit exclusion wording). Strip anything matching known role-title
    // patterns regardless of what the model returned — this is a hard code-level
    // filter, not just a prompt request, so it can't be "forgotten" mid-extraction.
    const ROLE_TITLE_PATTERN = /\b(team leader|resident engineer|structural designer|construction (project )?management expert|site engineer|project manager|key personnel|key professional|curriculum vitae|\bcv\b|deputy team leader|assistant engineer)\b/i;
    const filtered = deduped.filter(c => !ROLE_TITLE_PATTERN.test(c.description || ''));
    const removedCount = deduped.length - filtered.length;
    if(removedCount > 0){
      log(`Filtered out ${removedCount} row(s) that matched Team/Key Personnel role-title patterns (not genuine bidder eligibility)`);
    }

    // The eligibility table usually has one combined row like "Bid Processing
    // Fee & EMD Deposit" that just references a form number, with no actual
    // amount — the real numbers live in the Data Sheet elsewhere in the RFP.
    // Replace that row with two precise ones showing the real amounts.
    const FEE_EMD_PATTERN = /\b(bid processing fee|tender processing fee|emd|earnest money deposit)\b/i;
    const withoutFeeEmdRow = filtered.filter(c => !FEE_EMD_PATTERN.test(c.description || ''));
    const { fee, feeSource, emd, emdSource } = extractFeeAndEmdFromDataSheet(fullText);
    const feeEmdRows = [];
    if(fee){
      feeEmdRows.push({
        description: `Bid processing fee - INR ${fee}`,
        sourcePage: feeSource && feeSource.page, sourceDoc: feeSource ? feeSource.doc : 'RFP',
        originalNo: '1',
      });
    }
    if(emd){
      feeEmdRows.push({
        description: `EMD - INR ${emd}`,
        sourcePage: emdSource && emdSource.page, sourceDoc: emdSource ? emdSource.doc : 'RFP',
        originalNo: '1',
      });
    }
    if(feeEmdRows.length) log(`Split Bid Processing Fee / EMD into ${feeEmdRows.length} row(s) with real amounts from the Data Sheet`);

    state.eligibility = [...feeEmdRows, ...withoutFeeEmdRow].map((c,i)=>({ id: 'crit_'+(i+1), ...c }));
    log('Extracted ' + state.eligibility.length + ' unique eligibility criteria (from ' + merged.length + ' raw matches)');
  } catch(err){
    log('Eligibility extraction failed: ' + err.message);
  }
  clearProcessing();
}

/* ============================================================
   SCORING/EVALUATION RUBRIC EXTRACTION LOGIC
   (Separate from pass/fail eligibility — this is the marks-based
   technical scoring table, e.g. RFP Clause 4.1.2 / 4.2 style:
   fixed max marks per criterion, tiered scoring, sub-weights,
   qualifying threshold, and selection method like L1/QCBS.)
   ============================================================ */
// Builds the extraction prompt for one chunk/slice of text when scanning for
// the technical evaluation / scoring criteria table. Factored out so both the
// anchored single-slice path and the full-document fallback path share
// identical prompt wording.
function buildScoringCriteriaPrompt(chunkText, i, totalChunks){
  return `You are extracting rows from a tender document's TECHNICAL EVALUATION CRITERIA TABLE — the marks-based scoring table used to rank qualified bidders (often titled "Evaluation Criteria", "Technical Evaluation", "Marking Scheme"), NOT the pass/fail eligibility table. This is chunk ${i+1} of ${totalChunks} of a tender document (which may include both the original RFP and a later corrigendum that can amend/override RFP scoring rules — e.g. a revised max-marks value, changed tier thresholds, or an added/removed criterion). Only extract what's actually present here.

MOST IMPORTANT RULE: mirror the table exactly as printed. Each row typically has: a serial number, a "Criteria" cell (which itself contains the criterion name PLUS its full scoring rule — tiered marks, sub-weighted components, definitions like "Similar Projects shall mean...", all as one block of text, exactly like the source), a "Maximum Marks" cell, and a "Documents to be Submitted" cell. Reproduce the Criteria cell's full text faithfully — do not split tiers/sub-weights out into separate structured fields; keep them inline as the source presents them, since that is how this will be compared against a real filled-in evaluation report.

CHUNK CONTINUITY — IMPORTANT: this document has been split into sequential overlapping chunks, and a long technical evaluation table can easily span two or more chunks. The table's heading may appear ONLY in an earlier chunk, not this one. If this excerpt does NOT show that heading but contains what looks like a CONTINUATION of the scoring table — rows with a criterion description, a marks value, and often a documents-to-submit reference, especially if serial numbers continue a sequence — still extract them. Do not require the heading to be visible in every chunk; judge by whether the row's shape and content matches a genuine scoring-table row.

For each row found, capture:
- description: the FULL "Criteria" cell text as printed — criterion name + its complete scoring rule (tiers, sub-weights, definitions) all together, exactly as the source presents it
- maxMarks: the maximum marks/points for this row
- documentsRequired: the "Documents to be Submitted" cell text, or null if the table has no such column / this row has none listed
- requiresLiveAssessment: true if this criterion can ONLY be judged live (e.g. an oral technical presentation, interview, site visit) and NOT from submitted documents alone; false otherwise
- originalNo: the table's own printed serial number for this row, as a string, exactly as shown — preserve it even if it repeats or skips
- sourcePage: the number from the nearest [PAGE N] or [CORR PAGE N] marker in this excerpt, if present
- sourceDoc: "Corrigendum" if it came from a [CORR PAGE N] marker, otherwise "RFP"

HARD EXCLUSION — do not extract anything from a "Team", "Key Personnel", "Key Professionals", or "Staffing" section describing required project-team roles (e.g. Team Leader, Structural Designer, Resident Engineer) UNLESS it appears as a row inside the technical evaluation criteria table itself with its own marks allocation (e.g. "Relevant Experience of Key Personnel — 40 marks" as one scoring row is fine to include; a standalone staffing requirements list elsewhere in the document is not).

Also, if this chunk states the overall qualifying/minimum technical score (e.g. "minimum technical score of 70%") or the selection method (e.g. "L1", "QCBS 70:30", "80:20"), include ONE extra object: {"description": "SELECTION_METHOD", "maxMarks": null, "documentsRequired": null, "requiresLiveAssessment": false, "notes": "method=... ; qualifyingThresholdPct=..."}.

Return ONLY valid JSON: an array of objects as described. If neither a genuine technical-evaluation-criteria table nor a plausible continuation of one appears in this excerpt, return [].

Excerpt:
"""${chunkText}"""`;
}

async function runScoringCriteriaExtraction(){
  setProcessing(5);
  try{
    const fullText = combinedEligibilitySourceText();

    // Try to anchor directly to the Technical Evaluation Criteria section
    // first — this needs just ONE AI call instead of one per chunk of the
    // whole document, mirroring the eligibility extraction's approach.
    const anchoredSection = findScoringCriteriaSection(fullText);
    let chunks;
    if(anchoredSection){
      chunks = [anchoredSection];
      log(`Found "Technical Evaluation Criteria" section directly (${anchoredSection.length} chars) — using 1 AI call instead of scanning the full document`);
    } else {
      chunks = chunkText(fullText, 6000, 500);
      log(`Could not confidently locate the Technical Evaluation Criteria section — falling back to full-document scan: split into ${chunks.length} chunk(s)`);
    }

    let merged = [];
    for(let i=0; i<chunks.length; i++){
      const prompt = buildScoringCriteriaPrompt(chunks[i], i, chunks.length);
      try{
        const raw = await callAI('eligibility', [{role:'user', content: prompt}], {temperature:0.1, max_tokens:4000});
        const parsed = safeParseJsonArray(raw);
        merged = merged.concat(parsed);
        log(`Chunk ${i+1}/${chunks.length}: ${parsed.length} scoring item(s) found`);
      } catch(err){
        log(`Chunk ${i+1}/${chunks.length} scoring extraction failed: ${err.message}`);
      }
    }

    // If the anchored single-chunk attempt came back completely empty (e.g.
    // the section text didn't parse as expected, or this RFP's scoring table
    // never got picked up by the heading patterns), fall back once to the
    // full-document chunk scan rather than silently returning zero criteria.
    if(anchoredSection && merged.length === 0){
      log('Anchored scoring section returned 0 criteria — falling back to full-document scan');
      const fallbackChunks = chunkText(fullText, 6000, 500);
      for(let i=0; i<fallbackChunks.length; i++){
        const prompt = buildScoringCriteriaPrompt(fallbackChunks[i], i, fallbackChunks.length);
        try{
          const raw = await callAI('eligibility', [{role:'user', content: prompt}], {temperature:0.1, max_tokens:4000});
          const parsed = safeParseJsonArray(raw);
          merged = merged.concat(parsed);
          log(`Fallback chunk ${i+1}/${fallbackChunks.length}: ${parsed.length} scoring item(s) found`);
        } catch(err){
          log(`Fallback chunk ${i+1}/${fallbackChunks.length} scoring extraction failed: ${err.message}`);
        }
      }
    }

    // Pull out the selection-method marker, if any, from the LLM pass, but prefer
    // the direct regex read of the Data Sheet — it's usually a one-line plain
    // statement ("Method of selection: L1") that's more reliable to grab directly
    // than to trust an LLM to notice buried in a long document scan.
    const methodEntry = merged.find(m => m.description === 'SELECTION_METHOD');
    let llmMethod = null, llmPct = null;
    if(methodEntry){
      const methodMatch = (methodEntry.notes || '').match(/method\s*=\s*([^;]+)/i);
      const pctMatch = (methodEntry.notes || '').match(/qualifyingThresholdPct\s*=\s*([\d.]+)/i);
      llmMethod = methodMatch ? methodMatch[1].trim() : (methodEntry.notes || null);
      llmPct = pctMatch ? parseFloat(pctMatch[1]) : null;
    }
    const regexMethod = extractSelectionMethodFromDataSheet(fullText);
    state.selectionMethod = {
      method: regexMethod.method || llmMethod || '',
      qualifyingThresholdPct: regexMethod.qualifyingThresholdPct != null ? regexMethod.qualifyingThresholdPct : llmPct,
    };
    if(state.selectionMethod.method) log(`Selection method identified: ${state.selectionMethod.method}${state.selectionMethod.qualifyingThresholdPct ? ' (qualifying threshold ' + state.selectionMethod.qualifyingThresholdPct + '%)' : ''}`);

    // Dedupe actual scoring criteria (excluding the selection-method marker).
    // Same precedence rule as eligibility: if a corrigendum version and an RFP
    // version of the same criterion both appear, the corrigendum wins — it's
    // the later, binding amendment.
    const criteriaOnly = merged.filter(m => m.description !== 'SELECTION_METHOD' && m.description);
    const deduped = [];
    for(const c of criteriaOnly){
      const dupeIdx = deduped.findIndex(d => {
        const a = new Set(tokenize(c.description)), b = new Set(tokenize(d.description));
        const overlap = [...a].filter(t => b.has(t)).length;
        return overlap / Math.max(a.size, b.size, 1) > 0.6;
      });
      if(dupeIdx === -1){
        deduped.push(c);
      } else if(c.sourceDoc === 'Corrigendum' && deduped[dupeIdx].sourceDoc !== 'Corrigendum'){
        deduped[dupeIdx] = c; // corrigendum supersedes the RFP version
      }
    }

    // Same deterministic safety net as eligibility — strip anything that's really
    // a Team/Key Personnel STAFFING LIST leaking in (from the separate "Team"
    // section elsewhere in the RFP), not a genuine technical scoring criterion.
    // IMPORTANT: only apply this to rows with NO maxMarks value. A genuine
    // scoring row like "Relevant Experience of the Key Personnel — 40 marks"
    // legitimately lists role names (Team Leader, Structural Designer, etc.)
    // as its own sub-marks breakdown, and always carries a real maxMarks value
    // — the standalone Team/Personnel section table has no marks column at
    // all, so a role name leaking from THAT table will have maxMarks null.
    // Filtering on role-title text alone (regardless of maxMarks) wrongly
    // strips legitimate scoring rows that merely mention role titles.
    const ROLE_TITLE_PATTERN_TECH = /\b(team leader|resident engineer|structural designer|construction (project )?management expert|site engineer|deputy team leader|assistant engineer)\b/i;
    const filteredTech = deduped.filter(c => {
      const hasMarks = c.maxMarks !== null && c.maxMarks !== undefined && c.maxMarks !== '';
      if(hasMarks) return true; // genuine scoring row — keep regardless of role-title mentions
      return !ROLE_TITLE_PATTERN_TECH.test(c.description || '');
    });
    const removedTechCount = deduped.length - filteredTech.length;
    if(removedTechCount > 0){
      log(`Filtered out ${removedTechCount} row(s) with no marks value that matched standalone Team/Key Personnel role-title patterns`);
    }

    state.scoringCriteria = filteredTech.map((c,i)=>({ id: 'score_'+(i+1), ...c }));
    log(`Extracted ${state.scoringCriteria.length} scoring criteria` + (state.selectionMethod.method ? ` — selection method: ${state.selectionMethod.method}${state.selectionMethod.qualifyingThresholdPct ? ', qualifying threshold ' + state.selectionMethod.qualifyingThresholdPct + '%' : ''}` : ''));
  } catch(err){
    log('Scoring rubric extraction failed: ' + err.message);
  }
  clearProcessing();
}

/* ============================================================
   STAGE 6 — Bids Received & Submissions
   ============================================================ */

        })}

function createBidderFoldersByCount(){
  const input = document.getElementById('bidderCountInput');
  const n = parseInt(input.value, 10);
  if(!n || n < 1){
    log('Enter a valid number of bidders first');
    return;
  }
  const startAt = state.bidders.length;
  for(let i=1; i<=n; i++){
    addBidder('Bidder ' + (startAt + i), true);
  }
  log(`Created ${n} bidder folder(s) — rename each as needed`);
  render();
}

async function handleBidsPageUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  state.bidsPageFiles.push(file);
  setProcessing(6);
  log('OCR on bids-received page: ' + file.name);
  try{
    const text = await extractTextFromFile(file);
    // naive bidder-name extraction: lines that look like "1. XYZ Pvt Ltd" or similar
    const names = Array.from(new Set(
      (text.match(/^[ \t]*\d+[\.\)]\s*([A-Za-z][A-Za-z0-9 &.,'\-]{3,60})/gm) || [])
        .map(l => l.replace(/^[ \t]*\d+[\.\)]\s*/, '').trim())
    ));
    names.forEach(n => addBidder(n));
    log('Detected ' + names.length + ' bidder name(s) — verify and edit as needed');
  } catch(err){ log('Bids page parse error: ' + err.message); }
  clearProcessing();
}

function addBidder(name, isPlaceholder){
  state.bidders.push({
    id: 'bidder_' + (state.bidders.length+1),
    name: name || ('Bidder ' + (state.bidders.length+1)),
    technicalText:'', financialText:'', technicalFile:null,
    autoNamed: isPlaceholder || !name, // placeholder names (no name given, or explicitly marked) can be overwritten by auto-detection; a real detected/typed name locks it
  });
}
function addBidderManually(){ addBidder(''); render(); }
function renameBidder(i, name){
  state.bidders[i].name = name;
  state.bidders[i].autoNamed = false; // manual edit always wins from here on — auto-detect will no longer overwrite
}
function removeBidder(i){ state.bidders.splice(i,1); render(); }

async function handleBidFile(e, bidderIdx, field){
  const file = e.target.files[0];
  if(!file) return;
  setProcessing(6);
  const bidder = state.bidders[bidderIdx];
  const subfolder = field === 'technicalText' ? 'Technical' : 'Financial';
  log(`Parsing ${field} for ${bidder.name}: ${file.name}`);
  try{
    const text = await extractTextFromFile(file); // already page-tagged via extractTextFromPDF/[PAGE N]
    state.bidders[bidderIdx][field] = text;
    if(field === 'technicalText') state.bidders[bidderIdx].technicalFile = file; // keep reference for page preview
    log('Parsed OK');
    if(field === 'technicalText' && state.bidders[bidderIdx].autoNamed){
      detectBidderNameFromCoverPage(bidderIdx, text);
    }
  } catch(err){ log('Parse error: ' + err.message); }
  clearProcessing();
}

// Reads the cover page of a technical bid (first page, where the bidder's firm
// name and the project title usually appear) and renames the "Bidder N"
// placeholder to the detected name — but only if the user hasn't already
// renamed it manually (see autoNamed flag). The name field stays editable
// either way, so an incorrect detection can always be corrected by hand.
async function detectBidderNameFromCoverPage(bidderIdx, fullText){
  const coverExcerpt = fullText.slice(0, 3000); // first page or two, given [PAGE N] tagging
  const prompt = `This is the opening excerpt of a bid submission document (cover page / letterhead area). Identify the name of the BIDDER (the firm/company/consortium submitting the bid) — not the client/authority who issued the tender.

Excerpt:
"""${coverExcerpt}"""

Return ONLY valid JSON: {"bidderName": "..." or null if not confidently identifiable}`;
  try{
    const raw = await callAI('extract', [{role:'user', content: prompt}], {temperature:0.1, max_tokens:150});
    const parsed = safeParseJsonObject(raw);
    const bidder = state.bidders[bidderIdx];
    // Guard against races: only apply if this bidder still exists, is still on
    // its placeholder name, and the file hasn't been swapped out for another.
    if(parsed.bidderName && bidder && bidder.autoNamed){
      const detected = String(parsed.bidderName).trim().slice(0, 100);
      if(detected){
        bidder.name = detected;
        // stays autoNamed:true — a fresh auto-detection on a re-upload can still refine it,
        // until the user types into the name field themselves (renameBidder sets it false)
        log(`Detected bidder name from cover page: "${detected}" (edit the name field if this is wrong)`);
        render();
      }
    }
  } catch(err){
    log('Bidder name auto-detection failed (non-fatal): ' + err.message);
  }
}

/* ============================================================
   STAGE 7 — Evaluate Bids (LLM, heavy, per bidder x criterion)
   ============================================================ */
function renderStage7(){

  const techReady = state.scoringCriteria.length > 0 && state.bidders.length > 0;

    <h2>Stage 7 · Evaluate Bids</h2>
    <div class="row">
      <button ${!eligReady?'disabled':''} onclick="runEligibilityCheck()" id="eligCheckBtn">Check Eligibility</button>
      ${!eligReady ? '<span class="muted">Need eligibility criteria (Stage 4) plus at least one bidder with bid text (Stage 6)</span>' : `<span class="muted">Checks each bidder against the ${state.eligibility.length} eligibility condition(s) from Stage 4</span>`}
    </div>
    <div class="row">
      <button ${!techReady?'disabled':''} onclick="runTechnicalScoring()" id="techScoreBtn">Check Technical Score</button>
      ${!techReady ? '<span class="muted">Need technical scoring criteria (Stage 5) plus at least one bidder with bid text (Stage 6)</span>' : `<span class="muted">Scores each bidder against the ${state.scoringCriteria.length} technical criteria from Stage 5</span>`}
    </div>
  </div>
  ${state.bidders.length ? `
  <div class="card">
    <div class="bidder-tabs">

    </div>
    ${renderEvalTable(state._evalTab || 0)}
  </div>` : ''}
