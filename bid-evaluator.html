}

function setEvalTab(i){ state._evalTab = i; render(); }

function renderEvalTable(idx){
  const b = state.bidders[idx];
  if(!b) return '';
  const compliance = state.eligibilityCompliance[b.id] || [];
  const scoring = state.scoringResults[b.id] || [];
  const consensus = state.consensus[b.id];
  return `
    ${consensus ? `
      <div class="kv" style="margin-bottom:14px">
        <div>Eligibility</div><div>${consensus.allEligibleCompliant ? '<span class="badge ok">All Compliant</span>' : '<span class="badge warn">Flagged — verify manually (see table below; may be OCR error, not necessarily disqualifying)</span>'}</div>
        <div>Technical Score (docs-based)</div><div>${consensus.docsAwarded} / ${consensus.docsMax} (${consensus.docsPct.toFixed(1)}%)</div>
        ${consensus.liveMax > 0 ? `<div>Presentation (separate stage)</div><div>${consensus.liveMax} marks — scored later, after invitation; not part of this decision</div>` : ''}
        ${state.selectionMethod.qualifyingThresholdPct ? `<div>Presentation Invitation</div><div>Needs ${state.selectionMethod.qualifyingThresholdPct}% on docs-based technical criteria ${consensus.invitedToPresentation ? '<span class="badge ok">CLEARS — invite to presentation</span>' : `<span class="badge err">Does not clear (short by ${(state.selectionMethod.qualifyingThresholdPct - consensus.docsPct).toFixed(1)}pp)</span>`}</div>` : ''}
        ${consensus.canMathematicallyReachThreshold === false ? `<div>Financial-Opening Feasibility</div><div><span class="badge err">CANNOT reach ${state.selectionMethod.qualifyingThresholdPct}% of full total even with FULL marks in presentation — short by ${consensus.marksShortEvenWithFullPresentation.toFixed(1)} marks (best case: ${consensus.bestCaseGrandPct.toFixed(1)}%)</span></div>` : ''}
        <div>Needs Review</div><div>${consensus.needsReview ? '<span class="flag">YES — eligibility flagged, verify before finalizing</span>' : 'No'}</div>
      </div>
    ` : ''}

    ${compliance.length ? `
      <h2 style="font-size:14px;margin-bottom:8px">Eligibility Compliance <span class="muted" style="font-weight:400">— informational only, does not block technical scoring below</span></h2>
      <table style="margin-bottom:18px">
        <tr><th>Criterion</th><th>Status</th><th>Evidence / Reasoning</th><th></th></tr>
        ${compliance.map((r,ci)=>`
          <tr>
            <td>${escapeHtml(r.description)}</td>
            <td><span class="badge ${r.status==='Compliant'?'ok':(r.status==='Needs Clarification'?'warn':'err')}">${escapeHtml(r.status)}</span>${r.status!=='Compliant' ? ' <span class="muted" style="font-size:11px">(verify — could be OCR misread)</span>' : ''}</td>
            <td>${escapeHtml(r.evidence)}</td>
            <td>${r.evidencePage ? `<button class="secondary small" onclick="showBidEvidencePreview(${idx},'compliance',${ci})">👁 View Page</button>` : ''}</td>
          </tr>
        `).join('')}
      </table>
    ` : ''}

    ${scoring.length ? `
      <h2 style="font-size:14px;margin-bottom:8px">Technical Scoring</h2>
      <table>
        <tr><th>Criterion</th><th>Max Marks</th><th>Awarded</th><th>Justification</th><th></th></tr>
        ${scoring.map((r,ci)=>`
          <tr>
            <td>${escapeHtml(r.name)}</td>
            <td>${escapeHtml(String(r.maxMarks ?? '—'))}</td>
            <td>${r.requiresLiveAssessment ? '<span class="badge warn">Pending — live only</span>' : escapeHtml(String(r.marksAwarded ?? '—'))}</td>
            <td>${escapeHtml(r.justification || '—')}</td>
            <td>${r.evidencePage ? `<button class="secondary small" onclick="showBidEvidencePreview(${idx},'scoring',${ci})">👁 View Page</button>` : ''}</td>
          </tr>
        `).join('')}
      </table>
    ` : ''}

    ${!compliance.length && !scoring.length ? `<div class="muted">Not evaluated yet.</div>` : ''}
  `;
}

// Shared consensus-building logic, used by both the standalone eligibility
// check and the full evaluation run — computes the summary panel from
// whatever compliance/scoring results exist so far (scoring may be empty if
// only the eligibility check has been run yet).
function updateConsensus(bidder, complianceResults, scoringResults){
  const allEligibleCompliant = complianceResults.length ? complianceResults.every(r => r.status === 'Compliant') : null;
  const eligibilityFlagged = complianceResults.some(r => r.status !== 'Compliant');
  const docsAssessable = scoringResults.filter(r => !r.requiresLiveAssessment);
  const liveOnly = scoringResults.filter(r => r.requiresLiveAssessment);
  const docsAwarded = docsAssessable.reduce((s,r)=>s+(r.marksAwarded||0),0);
  const docsMax = docsAssessable.reduce((s,r)=>s+(r.maxMarks||0),0) || 1;
  const liveMax = liveOnly.reduce((s,r)=>s+(r.maxMarks||0),0);
  const grandMax = docsMax + liveMax;
  const docsPct = scoringResults.length ? (docsAwarded/docsMax)*100 : 0;
  const invitedToPresentation = (scoringResults.length && state.selectionMethod.qualifyingThresholdPct)
    ? docsPct >= state.selectionMethod.qualifyingThresholdPct
    : null;

  let canMathematicallyReachThreshold = null;
  let bestCaseGrandPct = null;
  let marksShortEvenWithFullPresentation = null;
  if(scoringResults.length && state.selectionMethod.qualifyingThresholdPct){
    const thresholdMarksNeeded = (state.selectionMethod.qualifyingThresholdPct/100) * grandMax;
    const bestCaseTotal = docsAwarded + liveMax; // assuming full marks in presentation
    bestCaseGrandPct = (bestCaseTotal/grandMax)*100;
    canMathematicallyReachThreshold = bestCaseTotal >= thresholdMarksNeeded;
    if(!canMathematicallyReachThreshold){
      marksShortEvenWithFullPresentation = (thresholdMarksNeeded - bestCaseTotal);
    }
  }

  state.consensus[bidder.id] = {
    allEligibleCompliant, eligibilityFlagged, docsAwarded, docsMax, docsPct, liveMax, grandMax,
    invitedToPresentation, canMathematicallyReachThreshold, bestCaseGrandPct, marksShortEvenWithFullPresentation,
    needsReview: eligibilityFlagged || canMathematicallyReachThreshold === false,
  };
}

// Standalone eligibility check — uses the exact eligibility criteria
// extracted in Stage 4 (state.eligibility) against each bidder's submitted
// text, independent of technical scoring. Faster than the full evaluation
// since it only makes one AI call per eligibility criterion per bidder.
async function runEligibilityCheck(){
  const btn = document.getElementById('eligCheckBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Checking…'; }
  setProcessing(7);
  try{
    for(const bidder of state.bidders){
      const bidText = (bidder.technicalText || '') + '\n\n' + (bidder.financialText || '');
      log(`${bidder.name}: checking against ${state.eligibility.length} eligibility condition(s) from Stage 4`);

      const complianceResults = [];
      for(const crit of state.eligibility){
        const excerpt = getRelevantExcerpt(bidText, crit.description, { topK: 3, maxChars: 10000 });
        const prompt = `Determine whether this bidder's bid COMPLIES with the following eligibility criterion. This is pass/fail, not a score.
Criterion: ${crit.description}${crit.type ? ` (type: ${crit.type}${crit.threshold ? ', threshold: ' + crit.threshold : ''})` : ''}

Bid excerpts (most relevant sections of a longer document; [...] marks a gap):
"""${excerpt}"""

Return ONLY valid JSON: {"status": "Compliant"|"Non-Compliant"|"Needs Clarification", "evidence": "brief evidence or reason, citing figures/dates found if present", "evidencePage": "the number from the nearest [PAGE N] marker where this evidence was found, or null if none identifiable"}`;
        try{
          const raw = await callAI('evaluate', [{role:'user', content: prompt}], {temperature:0.1, max_tokens:400});
          const parsed = safeParseJsonObject(raw);
          complianceResults.push({
            criterionId: crit.id,
            description: crit.description,
            status: parsed.status || 'Needs Clarification',
            evidence: parsed.evidence || '',
            evidencePage: parsed.evidencePage || null,
          });
        } catch(err){
          complianceResults.push({ criterionId: crit.id, description: crit.description, status: 'Needs Clarification', evidence: 'Evaluation error: ' + err.message, evidencePage: null });
        }
      }
      state.eligibilityCompliance[bidder.id] = complianceResults;

      // Recompute consensus using whatever technical scoring already exists
      // (may be empty if technical scoring hasn't been run yet) so the
      // summary panel reflects the eligibility result immediately.
      const existingScoring = state.scoringResults[bidder.id] || [];
      updateConsensus(bidder, complianceResults, existingScoring);

      const allCompliant = complianceResults.every(r => r.status === 'Compliant');
      log(`${bidder.name}: eligibility ${allCompliant ? 'all compliant' : 'flagged for manual check (may be OCR error)'}`);
      render();
    }
  } catch(err){
    log('Eligibility check failed: ' + err.message);
  }
  clearProcessing();
}

// Standalone technical scoring — uses the exact scoring criteria extracted
// in Stage 5 (state.scoringCriteria) against each bidder's submitted text,
// independent of the eligibility check. Can be run before, after, or without
// ever running the eligibility check; the consensus panel reflects whatever
// combination of the two has been run so far.
async function runTechnicalScoring(){
  const btn = document.getElementById('techScoreBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Scoring…'; }
  setProcessing(7);
  try{
    for(const bidder of state.bidders){
      const bidText = (bidder.technicalText || '') + '\n\n' + (bidder.financialText || '');
      log(`${bidder.name}: scoring against ${state.scoringCriteria.length} technical criteria from Stage 5`);

      const scoringResults = [];
      for(const crit of state.scoringCriteria){
        if(crit.requiresLiveAssessment){
          scoringResults.push({
            criterionId: crit.id, name: crit.description, maxMarks: crit.maxMarks,
            marksAwarded: null, requiresLiveAssessment: true, evidencePage: null,
            justification: 'Requires live assessment (e.g. presentation/interview) — not scoreable from documents.',
          });
          continue;
        }
        const excerpt = getRelevantExcerpt(bidText, crit.description, { topK: 4, maxChars: 14000 });
        const prompt = `Score this bidder against the following technical evaluation criterion, using the EXACT scoring rule given (including any tiers or sub-weights it states) — do not invent your own scale.
Criterion (full rule as printed in the RFP): ${crit.description}
Maximum marks: ${crit.maxMarks}

Bid excerpts (most relevant sections of a longer document; [...] marks a gap):
"""${excerpt}"""

Award marks strictly within 0 to ${crit.maxMarks}, following the tiered/weighted rule stated in the criterion text above if one is given. Justify briefly by naming what was found in the bid (e.g. which projects, whose CV, what experience count).

Return ONLY valid JSON: {"marksAwarded": number, "justification": "...", "evidencePage": "the number from the nearest [PAGE N] marker where the key evidence was found, or null if none identifiable"}`;
        try{
          const raw = await callAI('evaluate', [{role:'user', content: prompt}], {temperature:0.1, max_tokens:500});
          const parsed = safeParseJsonObject(raw);
          const awarded = Math.max(0, Math.min(crit.maxMarks ?? 100, Number(parsed.marksAwarded) || 0));
          scoringResults.push({
            criterionId: crit.id, name: crit.description, maxMarks: crit.maxMarks,
            marksAwarded: awarded, requiresLiveAssessment: false, evidencePage: parsed.evidencePage || null,
            justification: parsed.justification || '',
          });
        } catch(err){
          scoringResults.push({ criterionId: crit.id, name: crit.description, maxMarks: crit.maxMarks, marksAwarded: 0, requiresLiveAssessment: false, evidencePage: null, justification: 'Evaluation error: ' + err.message });
        }
      }
      state.scoringResults[bidder.id] = scoringResults;

      // Recompute consensus using whatever eligibility compliance already
      // exists (may be empty if the eligibility check hasn't been run yet).
      const existingCompliance = state.eligibilityCompliance[bidder.id] || [];
      updateConsensus(bidder, existingCompliance, scoringResults);

      const consensusNow = state.consensus[bidder.id];
      log(`${bidder.name}: docs-based technical ${consensusNow.docsAwarded}/${consensusNow.docsMax} (${consensusNow.docsPct.toFixed(1)}%)${consensusNow.invitedToPresentation!==null ? ` — ${consensusNow.invitedToPresentation ? 'CLEARS' : 'does not clear'} presentation threshold` : ''}`);
      render();
    }
  } catch(err){
    log('Technical scoring failed: ' + err.message);
  }
  clearProcessing();
}



/* ============================================================

      ${rankedBidders().map((b,i)=>`

          <td>${b.canMathematicallyReachThreshold === null ? '—' : (b.canMathematicallyReachThreshold ? `<span class="badge ok">Yes (best case ${b.bestCaseGrandPct.toFixed(1)}%)</span>` : `<span class="badge err">NO — even full presentation marks fall short by ${b.marksShortEvenWithFullPresentation.toFixed(1)}</span>`)}</td>

  </div>` : ''}
  ${state.report.executiveSummary ? `

function rankedBidders(){
  return state.bidders
    .map(b => ({ name: b.name, ...state.consensus[b.id] }))
    .filter(b => b.docsPct !== undefined)
    .sort((a,b) => b.docsPct - a.docsPct);
}

async function runReportGeneration(){
  const btn = document.getElementById('reportBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Drafting…';
  setProcessing(8);
  try{
    const ranked = rankedBidders();
    const prompt = `Draft an executive summary and presentation-invitation recommendation from this bid evaluation. This evaluation happens BEFORE any presentation — it determines which bidders get invited to present, using only document-assessable technical criteria.
Tender: ${state.tender.nitNo || '(no NIT number captured)'}, Department: ${state.tender.department || 'n/a'}
Selection method: ${state.selectionMethod.method || 'not specified'}${state.selectionMethod.qualifyingThresholdPct ? `, minimum ${state.selectionMethod.qualifyingThresholdPct}% on docs-based technical criteria required to be invited to present` : ''}

Ranked bidders (name, eligibility status, docs-based technical score, invited to presentation?, needs-review flag):
${ranked.map(r=>`- ${r.name}: eligibility ${r.allEligibleCompliant ? 'Compliant' : 'Flagged for manual verification (may be an OCR/extraction error, not necessarily a real issue)'}; docs-based technical ${r.docsAwarded}/${r.docsMax} (${r.docsPct.toFixed(1)}%); ${r.invitedToPresentation ? 'CLEARS threshold — invite to presentation' : 'does not clear threshold'}${r.canMathematicallyReachThreshold === false ? `; CANNOT mathematically reach the financial-opening threshold even with full marks in presentation (best case only ${r.bestCaseGrandPct.toFixed(1)}%)` : ''}; needs review: ${r.needsReview}`).join('\n')}

Write 3-4 short paragraphs: overview of the evaluation, key differentiators between top bidders, any eligibility flags that need manual verification before finalizing (note explicitly these could be OCR errors), and a recommendation on which bidders to invite to the technical presentation stage. Do not declare a final award — presentation and financial evaluation are still pending.`;
    const summary = await callAI('report', [{role:'user', content: prompt}], {temperature:0.4, max_tokens:1200});
    state.report.executiveSummary = summary;
    log('Executive summary drafted');
  } catch(err){
    log('Report generation failed: ' + err.message);
    alert('Report generation failed: ' + err.message);
  }

}

function setReportOrientation(o){
  state.reportOrientation = o;
  render();
}

// Builds the side-by-side eligibility compliance matrix exactly like the sample
// report: rows = criteria, one column per bidder showing status + evidence.
function buildComplianceMatrixRows(){
  const rows = [['#','Eligibility Conditions', ...state.bidders.map(b=>b.name)]];
  state.eligibility.forEach((crit, i) => {
    const statusRow = [i+1, crit.description];
    state.bidders.forEach(b => {
      const r = (state.eligibilityCompliance[b.id] || []).find(c => c.criterionId === crit.id);
      statusRow.push(r ? r.status : '—');
    });
    rows.push(statusRow);
    const evidenceRow = ['', '(Evidence)', ...state.bidders.map(b => {
      const r = (state.eligibilityCompliance[b.id] || []).find(c => c.criterionId === crit.id);
      return r ? r.evidence : '';
    })];
    rows.push(evidenceRow);
  });
  return rows;
}

    ['Tender Evaluation Report — Presentation Invitation Stage'],
    ['NIT No', state.tender.nitNo],
    ['Department', state.tender.department],
    ['Closing Date', state.tender.closeDate],
    ['Selection Method', state.selectionMethod.method || ''],
    ['Min. % on Docs-Based Technical Criteria to Invite', state.selectionMethod.qualifyingThresholdPct || ''],
    [],
    ['Rank','Bidder','Eligibility','Docs Marks Awarded','Docs Max Marks','Docs %','Presentation Marks (Separate Stage)','Invite to Presentation?','Can Reach Financial-Opening Threshold?','Best Case % (Full Presentation Marks)','Needs Review'],
    ...ranked.map((b,i)=>[i+1, b.name, b.allEligibleCompliant?'Compliant':'Flagged — verify', b.docsAwarded, b.docsMax, b.docsPct.toFixed(1), b.liveMax||0, b.invitedToPresentation===null?'N/A':(b.invitedToPresentation?'YES':'NO'), b.canMathematicallyReachThreshold===null?'N/A':(b.canMathematicallyReachThreshold?'YES':'NO'), b.bestCaseGrandPct!==null?b.bestCaseGrandPct.toFixed(1):'', b.needsReview?'YES':'No']),
  ]);
  summarySheet['!pageSetup'] = { orientation: landscape ? 'landscape' : 'portrait', fitToPage: true };
  XLSX.utils.book_append_sheet(wb, summarySheet, 'Summary');

  // Side-by-side compliance matrix — mirrors the sample report's layout with
  // bidders as columns. In landscape, columns get more room per bidder; in
  // portrait, columns are narrower and text wraps.
  const complianceSheet = XLSX.utils.aoa_to_sheet(buildComplianceMatrixRows());
  const bidderColWidth = landscape ? 32 : 18;
  complianceSheet['!cols'] = [{wch:4},{wch: landscape?45:28}, ...state.bidders.map(()=>({wch:bidderColWidth}))];
  complianceSheet['!pageSetup'] = { orientation: landscape ? 'landscape' : 'portrait', fitToPage: true, fitToWidth: 1 };
  XLSX.utils.book_append_sheet(wb, complianceSheet, 'Bidders Compliance Matrix');

  state.bidders.forEach(b=>{
    const scoring = state.scoringResults[b.id] || [];

      ['Evaluation Criteria of e-bids (' + b.name + ')'],
      ['#','Criteria','Max Marks','Details Submitted / Justification','Marks Proposed to be Awarded'],
      ...scoring.map((r,i)=>[i+1, r.name, r.maxMarks, r.justification, r.requiresLiveAssessment ? 'PENDING (live only)' : r.marksAwarded]),
      ['','','','TOTAL (docs-based)', scoring.filter(r=>!r.requiresLiveAssessment).reduce((s,r)=>s+(r.marksAwarded||0),0)],
    ]);
    sheet['!cols'] = landscape
      ? [{wch:4},{wch:32},{wch:10},{wch:70},{wch:14}]
      : [{wch:4},{wch:22},{wch:10},{wch:40},{wch:12}];
    sheet['!pageSetup'] = { orientation: landscape ? 'landscape' : 'portrait', fitToPage: true, fitToWidth: 1 };
    XLSX.utils.book_append_sheet(wb, sheet, ('Eval - ' + (b.name || 'Bidder')).slice(0,31));
  });

  const eligSheet = XLSX.utils.aoa_to_sheet([
    ['#','Eligibility Conditions','Source'],
    ...state.eligibility.map((c,i)=>[c.originalNo != null ? String(c.originalNo) : String(i+1), c.description, c.sourcePage ? `${c.sourceDoc||'RFP'} p.${c.sourcePage}` : '']),
  ]);
  eligSheet['!pageSetup'] = { orientation: landscape ? 'landscape' : 'portrait', fitToPage: true };
  XLSX.utils.book_append_sheet(wb, eligSheet, 'Eligibility Criteria');

  const scoreCritSheet = XLSX.utils.aoa_to_sheet([
    ['#','Criteria','Maximum Marks','Documents to be Submitted','Live Assessment Only?'],
    ...state.scoringCriteria.map((c,i)=>[c.originalNo != null ? String(c.originalNo) : String(i+1), c.description, c.maxMarks||'', c.documentsRequired||'', c.requiresLiveAssessment?'Yes':'No']),
  ]);
  scoreCritSheet['!pageSetup'] = { orientation: landscape ? 'landscape' : 'portrait', fitToPage: true };
  XLSX.utils.book_append_sheet(wb, scoreCritSheet, 'Scoring Rubric');

  XLSX.writeFile(wb, `Bid_Evaluation_Report_${state.reportOrientation}.xlsx`);
  log(`Excel report exported (${state.reportOrientation})`);
}

/* ============================================================
   WORD REPORT EXPORT (docx.js) — mirrors the same content as
   Excel, styled like the sample report: side-by-side compliance
   matrix, then one evaluation table per bidder. Orientation flips
   page dimensions and widens/narrows columns to fit.
   ============================================================ */
async function exportWordReport(){
  const btn = document.getElementById('wordBtn');
  const orig = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Building…';
  setProcessing(8);
  try{
    const { Document, Packer, Paragraph, Table, TableRow, TableCell, TextRun, HeadingLevel,
            WidthType, PageOrientation, ShadingType, BorderStyle, AlignmentType } = docx;

    const landscape = state.reportOrientation === 'landscape';
    // US Letter portrait dims in DXA; docx-js swaps these internally when LANDSCAPE is set.
    const PAGE_W = 12240, PAGE_H = 15840, MARGIN = 1080;
    const usableWidth = (landscape ? PAGE_H : PAGE_W) - MARGIN*2;

    const HEADER_SHADE = 'D4D8E2';
    function cell(text, {width, bold=false, shade=null, align=AlignmentType.LEFT} = {}){
      return new TableCell({
        width: { size: width, type: WidthType.DXA },
        shading: shade ? { type: ShadingType.CLEAR, fill: shade } : undefined,
        children: [new Paragraph({ alignment: align, children: [new TextRun({ text: String(text ?? ''), bold })] })],
      });
    }
    function row(cells){ return new TableRow({ children: cells }); }
    function heading(text){ return new Paragraph({ text, heading: HeadingLevel.HEADING_2, spacing: { before: 300, after: 150 } }); }
    function para(text){ return new Paragraph({ text: text || '', spacing: { after: 150 } }); }

    const children = [];
    children.push(new Paragraph({ text: 'Bid Evaluation Report', heading: HeadingLevel.HEADING_1, spacing: { after: 100 } }));
    children.push(para(`NIT No: ${state.tender.nitNo || 'n/a'}   |   Department: ${state.tender.department || 'n/a'}   |   Closing Date: ${state.tender.closeDate || 'n/a'}`));
    if(state.selectionMethod.method){
      children.push(para(`Selection Method: ${state.selectionMethod.method}${state.selectionMethod.qualifyingThresholdPct ? ` — minimum ${state.selectionMethod.qualifyingThresholdPct}% on docs-based technical criteria to be invited to present` : ''}`));
    }

    // --- Ranking table ---
    children.push(heading('Ranking'));
    const rankCols = [1000, landscape?3600:2400, 1400, landscape?2600:1800, landscape?2600:1800, 1400];
    const rankTotal = rankCols.reduce((a,b)=>a+b,0);
    const rankScale = usableWidth / rankTotal;
    const rankW = rankCols.map(w => Math.round(w*rankScale));
    const ranked = rankedBidders();
    children.push(new Table({
      width: { size: usableWidth, type: WidthType.DXA },
      columnWidths: rankW,
      rows: [
        row(['Rank','Bidder','Eligibility','Technical (docs)','Invite to Presentation?','Needs Review'].map((h,i)=>cell(h,{width:rankW[i],bold:true,shade:HEADER_SHADE}))),
        ...ranked.map((b,i)=>row([
          cell(i+1,{width:rankW[0]}),
          cell(b.name,{width:rankW[1]}),
          cell(b.allEligibleCompliant?'Compliant':'Flagged — verify',{width:rankW[2]}),
          cell(`${b.docsAwarded}/${b.docsMax} (${b.docsPct.toFixed(1)}%)`,{width:rankW[3]}),
          cell(b.invitedToPresentation===null?'—':(b.invitedToPresentation?'Yes':'No'),{width:rankW[4]}),
          cell(b.needsReview?'Yes':'No',{width:rankW[5]}),
        ])),
      ],
    }));

    // --- Side-by-side compliance matrix (mirrors sample report layout) ---
    children.push(heading('Bidders Compliance to Eligibility Criteria'));
    const nBidders = state.bidders.length || 1;
    const numCol = 500, condCol = landscape ? 3200 : 2400;
    const bidderColW = Math.round((usableWidth - numCol - condCol) / nBidders);
    const compCols = [numCol, condCol, ...state.bidders.map(()=>bidderColW)];
    const compRows = buildComplianceMatrixRows();
    children.push(new Table({
      width: { size: usableWidth, type: WidthType.DXA },
      columnWidths: compCols,
      rows: compRows.map((r, ri) => row(r.map((v,ci)=>cell(v, { width: compCols[ci], bold: ri===0, shade: ri===0?HEADER_SHADE:null })))),
    }));

    // --- One evaluation table per bidder ---
    state.bidders.forEach(b=>{
      const scoring = state.scoringResults[b.id] || [];
      children.push(heading(`Evaluation Criteria of e-bids (${b.name})`));
      const evalCols = [500, landscape?3400:2200, 1200, landscape?7500:4500, 1500];
      const evalTotal = evalCols.reduce((a,b2)=>a+b2,0);
      const evalScale = usableWidth / evalTotal;
      const evalW = evalCols.map(w=>Math.round(w*evalScale));
      const docsTotal = scoring.filter(r=>!r.requiresLiveAssessment).reduce((s,r)=>s+(r.marksAwarded||0),0);
      children.push(new Table({
        width: { size: usableWidth, type: WidthType.DXA },
        columnWidths: evalW,
        rows: [
          row(['#','Criteria','Max Marks','Details Submitted / Justification','Marks Awarded'].map((h,i)=>cell(h,{width:evalW[i],bold:true,shade:HEADER_SHADE}))),
          ...scoring.map((r,i)=>row([
            cell(i+1,{width:evalW[0]}),
            cell(r.name,{width:evalW[1]}),
            cell(r.maxMarks ?? '—',{width:evalW[2]}),
            cell(r.justification || '—',{width:evalW[3]}),
            cell(r.requiresLiveAssessment ? 'PENDING (live only)' : (r.marksAwarded ?? '—'),{width:evalW[4]}),
          ])),
          row([
            cell('',{width:evalW[0]}), cell('',{width:evalW[1]}), cell('',{width:evalW[2]}),
            cell('TOTAL (docs-based)',{width:evalW[3],bold:true}), cell(docsTotal,{width:evalW[4],bold:true}),
          ]),
        ],
      }));
    });

    if(state.report.executiveSummary){
      children.push(heading('Executive Summary'));
      state.report.executiveSummary.split('\n').filter(Boolean).forEach(p => children.push(para(p)));
    }

    const doc = new Document({
      sections: [{
        properties: {
          page: {
            size: { width: PAGE_W, height: PAGE_H, orientation: landscape ? PageOrientation.LANDSCAPE : undefined },
            margin: { top: MARGIN, bottom: MARGIN, left: MARGIN, right: MARGIN },
          },
        },
        children,
      }],
    });

    const blob = await Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `Bid_Evaluation_Report_${state.reportOrientation}.docx`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    log(`Word report exported (${state.reportOrientation})`);
  } catch(err){
    log('Word export failed: ' + err.message);
    alert('Word export failed: ' + err.message);
  }
  btn.disabled = false; btn.innerHTML = orig;
  clearProcessing();
}

/* ============================================================
   UTILITIES
   ============================================================ */
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function safeParseJsonArray(raw){
  const cleaned = raw.replace(/```json|```/g, '').trim();
  try{
    const parsed = JSON.parse(cleaned);
    return Array.isArray(parsed) ? parsed : (parsed.criteria || parsed.items || []);
  } catch(e){
    // try to find a JSON array substring
    const m = cleaned.match(/\[[\s\S]*\]/);
    if(m){ try{ return JSON.parse(m[0]); } catch(e2){} }

    // Response was likely truncated mid-array (hit the token limit) — rather
    // than lose every row in this chunk, salvage whichever leading objects are
    // complete by progressively trimming back to the last balanced "},ZERO_OR_MORE_WHITESPACE"
    // boundary and closing the array there.
    const arrayStart = cleaned.indexOf('[');
    if(arrayStart !== -1){
      let candidate = cleaned.slice(arrayStart);
      // Strip a trailing partial object (no closing brace) if present
      let lastGoodEnd = -1;
      let depth = 0;
      for(let i = 0; i < candidate.length; i++){
        if(candidate[i] === '{') depth++;
        else if(candidate[i] === '}'){
          depth--;
          if(depth === 0) lastGoodEnd = i; // end of a complete top-level object
        }
      }
      if(lastGoodEnd !== -1){
        const salvaged = candidate.slice(0, lastGoodEnd + 1) + ']';
        try{
          const parsed = JSON.parse(salvaged);
          if(Array.isArray(parsed) && parsed.length){
            log(`Response appears truncated — salvaged ${parsed.length} complete row(s) instead of losing the whole chunk`);
            return parsed; // partial recovery — better than losing the whole chunk
          }
        } catch(e3){}
      }
    }
    throw new Error('Could not parse LLM JSON response (possibly truncated)');
  }
}

function safeParseJsonObject(raw){
  const cleaned = raw.replace(/```json|```/g, '').trim();
  try{ return JSON.parse(cleaned); }
  catch(e){
    const m = cleaned.match(/\{[\s\S]*\}/);
    if(m){ try{ return JSON.parse(m[0]); } catch(e2){} }
    throw new Error('Could not parse LLM JSON response');
  }
}
